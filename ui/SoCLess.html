// Highlight matched chars in a string given a fuzzy needle.
// Returns an array of {text, hi} spans.
function fuzzyHighlight(label, needle) {
  if (!needle) return [{ text: label, hi: false }];
  const lo = label.toLowerCase(), nlo = needle.toLowerCase();
  const spans = [];
  let ni = 0, lastEnd = 0;
  for (let i = 0; i < lo.length && ni < nlo.length; i++) {
    if (lo[i] === nlo[ni]) {
      if (i > lastEnd) spans.push({ text: label.slice(lastEnd, i), hi: false });
      spans.push({ text: label[i], hi: true });
      lastEnd = i + 1;
      ni++;
    }
  }
  // Scoring matches against label + subtitle; when the match came from the
  // subtitle the label-only subsequence is incomplete and partial marks
  // would highlight the wrong characters (issue #98). Show none instead.
  if (ni < nlo.length) return [{ text: label, hi: false }];
  if (lastEnd < label.length) spans.push({ text: label.slice(lastEnd), hi: false });
  return spans;
}

// ─── Command palette ─ ⌘K search over modules + instances + ports ─────────
function CommandPalette({ open, onClose, onNavigate }) {
  const [q, setQ] = useState('');
  const [cursor, setCursor] = useState(0);
  const inputRef = useRef(null);

  // Index everything once per design version (the parent's `key` remount
  // recreates this component on every load, but we still gate the memo so a
  // search session within one design doesn't reindex on every keystroke).
  const items = useMemo(() => {
    const out = [];
    for (const m of Object.values(B_MODULES)) {
      out.push({ kind: 'module', label: m.name, sub: m.doc || m.type, payload: [m.name] });
      (m.children || []).forEach((c) => {
        out.push({
          kind: 'instance',
          label: m.name + '.' + c.name,
          sub: c.type + (c.doc ? ' · ' + c.doc : ''),
          payload: B_MODULES[c.type] ? [c.type] : [m.name],
        });
      });
      (m.ports || []).forEach((p) => {
        out.push({
          kind: 'port',
          label: m.name + ':' + p.name,
          sub: (p.dir || '?') + ' ' + (p.bundle || ''),
          payload: [m.name],
        });
        // Index one level of bundle channels and Vec elements so the pin
        // paths visible on screen (io.in[0], io.ar, ...) are searchable
        // (issue #98: they previously returned 'No matches').
        const addSub = (name, key) => out.push({
          kind: 'port',
          label: m.name + ':' + name,
          sub: key || '',
          payload: [m.name],
        });
        const b = B_BUNDLES[p.bundle];
        const vec = /^Vec\[(.+),\s*(\d+)\]$/.exec(p.bundle || '');
        if (b && b.kind === 'Bundle') {
          for (const ch of (b.channels || [])) {
            const chKey = ch.type;
            const chVec = /^Vec\[(.+),\s*(\d+)\]$/.exec(chKey || '');
            if (chVec) {
              const n = Math.min(parseInt(chVec[2], 10), 16);
              for (let i = 0; i < n; i++) addSub(p.name + '.' + ch.name + '[' + i + ']', chVec[1].trim());
            } else {
              addSub(p.name + '.' + ch.name, chKey);
            }
          }
        } else if (vec) {
          const n = Math.min(parseInt(vec[2], 10), 16);
          for (let i = 0; i < n; i++) addSub(p.name + '[' + i + ']', vec[1].trim());
        }
      });
    }
    return out;
  }, []);

  const results = useMemo(() => {
    if (!q.trim()) return items.slice(0, 60);
    const needle = q.toLowerCase();
    const scored = [];
    for (const it of items) {
      const target = (it.label + ' ' + (it.sub || '')).toLowerCase();
      // Fuzzy subsequence match with scoring:
      //   score = lower is better
      //   - substring match earns a large bonus (subtract 1000)
      //   - start-of-word match earns a smaller bonus (subtract 200)
      //   - contiguity: penalise gaps between matched chars
      //   - kind bonus: modules rank first (0 extra), others +1
      let ni = 0, score = 0, lastHit = -1;
      let allHit = true, contiguousRun = 0;
      for (let ti = 0; ti < target.length && ni < needle.length; ti++) {
        if (target[ti] === needle[ni]) {
          const gap = lastHit < 0 ? 0 : ti - lastHit - 1;
          score += gap;                          // penalise gaps
          if (gap === 0) contiguousRun++;        // reward contiguous chars
          lastHit = ti;
          ni++;
        }
      }
      if (ni < needle.length) { allHit = false; }
      if (!allHit) continue;
      // Bonuses
      if (target.indexOf(needle) >= 0) score -= 1000;           // exact substring wins
      if (target.startsWith(needle) || it.label.toLowerCase().startsWith(needle)) score -= 200; // leading match
      // Word-start bonus: first char of needle matches a word boundary in target
      if (needle.length > 0) {
        // Regex-escape: a query starting with '[', '(' or '\' must not throw
        // a SyntaxError out of the render (issue #98).
        const firstChar = needle[0].replace(/[.*+?^$()|[\]{}\\]/g, '\\$&');
        if (target[0] === needle[0]) score -= 100;
        const wbIdx = target.search(new RegExp('(?:^|[\\s._/-])' + firstChar));
        if (wbIdx >= 0) score -= 80;
      }
      score -= contiguousRun * 5;                               // reward long runs
      score += it.kind === 'module' ? 0 : 1;                   // tiebreak: modules first
      scored.push({ ...it, score, _matchTarget: target });
    }
    scored.sort((a, b) => a.score - b.score);
    return scored.slice(0, 100);
  }, [q, items]);

  useEffect(() => {
    if (open) { setQ(''); setCursor(0); setTimeout(() => inputRef.current && inputRef.current.focus(), 0); }
  }, [open]);
  useEffect(() => { setCursor(0); }, [q]);

  if (!open) return null;
  const KIND_COLOR = { module: benchTokens.accent, instance: 'oklch(0.55 0.16 290)', port: 'oklch(0.55 0.16 50)' };

  return (
    <div onClick={onClose} data-command-palette="1"
      // Escape must close the palette regardless of which child (input or a
      // result button) owns focus (issue #98: the input handler alone missed
      // focus on results).
      onKeyDown={(e) => { if (e.key === 'Escape') { e.stopPropagation(); onClose(); } }}
      style={{
      position: 'fixed', inset: 0, background: 'rgba(20,20,18,0.32)',
      display: 'flex', justifyContent: 'center', paddingTop: '12vh', zIndex: 100,
    }}>
      <div onClick={(e) => e.stopPropagation()} style={{
        width: 580, maxWidth: '90vw', maxHeight: '70vh',
        background: benchTokens.panel, border: `1px solid ${benchTokens.border}`,
        borderRadius: 10, boxShadow: '0 24px 60px rgba(0,0,0,0.22)',
        display: 'flex', flexDirection: 'column', overflow: 'hidden',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '10px 14px', borderBottom: `1px solid ${benchTokens.borderSoft}` }}>
          <svg width="13" height="13" viewBox="0 0 11 11" fill="none" stroke={benchTokens.ink3} strokeWidth="1.5"><circle cx="4.5" cy="4.5" r="3"/><path d="M7 7l2.5 2.5"/></svg>
          <input
            ref={inputRef}
            value={q}
            data-cmd-input="1"
            placeholder="Search modules, instances, ports…"
            onChange={(e) => setQ(e.target.value)}
            onKeyDown={(e) => {
              if (e.key === 'Escape') { onClose(); }
              else if (e.key === 'ArrowDown') { setCursor((c) => Math.min(c + 1, results.length - 1)); e.preventDefault(); }
              else if (e.key === 'ArrowUp')   { setCursor((c) => Math.max(c - 1, 0)); e.preventDefault(); }
              else if (e.key === 'Enter') {
                const hit = results[cursor];
                if (hit) { onNavigate(hit.payload); onClose(); }
              }
            }}
            style={{
              flex: 1, border: 'none', outline: 'none', background: 'transparent',
              fontFamily: benchTokens.sans, fontSize: 14, color: benchTokens.ink,
            }}
          />
          <span style={{ fontFamily: benchTokens.mono, fontSize: 10, color: benchTokens.ink4 }}>
            {results.length} {results.length === 1 ? 'result' : 'results'}
          </span>
        </div>
        <div style={{ overflowY: 'auto', padding: 4 }}>
          {results.length === 0 ? (
            <div style={{ padding: '24px 14px', color: benchTokens.ink3, fontSize: 12, textAlign: 'center' }}>
              No matches for "{q}".
            </div>
          ) : results.map((r, i) => {
            const active = i === cursor;
            return (
              <button
                key={r.kind + ':' + r.label + ':' + i}
                data-cmd-result={r.label}
                onMouseEnter={() => setCursor(i)}
                onClick={() => { onNavigate(r.payload); onClose(); }}
                style={{
                  display: 'flex', alignItems: 'center', gap: 10, width: '100%',
                  padding: '7px 10px', borderRadius: 6, border: 'none',
                  background: active ? benchTokens.accentBg : 'transparent',
                  cursor: 'pointer', textAlign: 'left',
                }}
              >
                <span style={{
                  fontFamily: benchTokens.mono, fontSize: 9.5, padding: '1px 5px',
                  borderRadius: 3, color: KIND_COLOR[r.kind], background: benchTokens.bg,
                  border: `1px solid ${benchTokens.borderSoft}`, textTransform: 'uppercase',
                  letterSpacing: 0.4, minWidth: 60, textAlign: 'center',
                }}>{r.kind}</span>
                <span title={r.label} style={{ fontFamily: benchTokens.mono, fontSize: 12, color: active ? benchTokens.accent : benchTokens.ink, fontWeight: active ? 600 : 400, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', minWidth: 0 }}>
                  {q.trim() ? fuzzyHighlight(r.label, q).map((s, si) =>
                    s.hi
                      ? <mark key={si} style={{ background: 'transparent', color: benchTokens.accent, fontWeight: 700 }}>{s.text}</mark>
                      : <span key={si}>{s.text}</span>
                  ) : r.label}
                </span>
                <span title={r.sub} style={{ fontSize: 11, color: benchTokens.ink3, marginLeft: 'auto', overflow: 'hidden', whiteSpace: 'nowrap', textOverflow: 'ellipsis', maxWidth: 240 }}>{r.sub}</span>
              </button>
            );
          })}
        </div>
        <div style={{ display: 'flex', gap: 14, padding: '7px 14px', borderTop: `1px solid ${benchTokens.borderSoft}`, fontSize: 10.5, color: benchTokens.ink4, fontFamily: benchTokens.mono }}>
          <span>↑↓ navigate</span><span>↵ go</span><span>esc close</span>
        </div>
      </div>
    </div>
  );
}

// ─── Hierarchy tree (left) ───────────────────────────────────────────────────
function BenchHierarchy({ path, setPath, density }) {
  const top = window.DESIGN.TOP || Object.keys(B_MODULES)[0] || 'AXISystem';
  const root = B_MODULES[top];
  // Auto-expand the top plus first level of children for orientation.
  const initialExpanded = useMemo(() => {
    const s = new Set([top]);
    if (root && root.children) root.children.forEach((c) => s.add(c.name));
    return s;
  }, [top]);
  const [expanded, setExpanded] = useState(initialExpanded);

  // Build flat list with indent levels
  const rows = useMemo(() => {
    const out = [];
    const walk = (instName, modName, p, depth) => {
      const mod = B_MODULES[modName];
      const isLeaf = !mod || mod.children.length === 0;
      const id = p.join('/');
      out.push({ id, label: instName, type: modName, depth, isLeaf, path: p });
      if (mod && expanded.has(id)) {
        for (const c of mod.children) walk(c.name, c.type, [...p, c.name], depth + 1);
      }
    };
    walk(top, top, [top], 0);
    return out;
  }, [expanded]);

  const toggle = (id) => setExpanded((s) => { const n = new Set(s); if (n.has(id)) n.delete(id); else n.add(id); return n; });
  const activeId = path.join('/');

  return (
    <div style={{ width: 240, flexShrink: 0, background: benchTokens.panel, overflowY: 'auto', display: 'flex', flexDirection: 'column' }}>
      <div style={{ padding: '10px 12px 6px', fontSize: 10.5, fontWeight: 600, color: benchTokens.ink3, letterSpacing: 0.6, textTransform: 'uppercase', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <span>Hierarchy</span>
        <span style={{ fontFamily: benchTokens.mono, color: benchTokens.ink4, textTransform: 'none', letterSpacing: 0 }}>{rows.length}</span>
      </div>
      <div style={{ padding: '0 4px 8px', flex: 1 }}>
        {rows.map((r) => {
          const isActive = r.id === activeId;
          const isAncestor = activeId.startsWith(r.id + '/');
          const hasKids = !r.isLeaf;
          const isOpen = expanded.has(r.id);
          return (
            <div
              key={r.id}
              data-hier-path={r.id}
              data-hier-leaf={r.isLeaf ? '1' : '0'}
              onClick={() => setPath(r.path)}
              title={r.path.join(' > ')}
              style={{
                display: 'flex', alignItems: 'center', gap: 4,
                height: density.row, padding: '0 4px 0 0',
                paddingLeft: 4 + r.depth * 14,
                cursor: 'pointer', minWidth: 0, overflow: 'hidden',
                background: isActive ? benchTokens.accentBg : 'transparent',
                borderLeft: `2px solid ${isActive ? benchTokens.accent : 'transparent'}`,
                color: isActive ? benchTokens.accent : (isAncestor ? benchTokens.ink : benchTokens.ink2),
                fontWeight: isActive ? 600 : 400,
                fontSize: density.font - 0.5,
              }}
              onMouseEnter={(e) => { if (!isActive) e.currentTarget.style.background = benchTokens.panelAlt; }}
              onMouseLeave={(e) => { if (!isActive) e.currentTarget.style.background = 'transparent'; }}
            >
              <span
                data-hier-toggle={hasKids ? r.id : undefined}
                onClick={(e) => { if (hasKids) { e.stopPropagation(); toggle(r.id); } }}
                style={{ width: 12, display: 'inline-flex', justifyContent: 'center', color: benchTokens.ink4 }}
              >
                {hasKids ? (
                  <svg width="9" height="9" viewBox="0 0 9 9" fill="currentColor" style={{ transform: isOpen ? 'rotate(90deg)' : 'none', transition: 'transform .12s' }}>
                    <path d="M2 1.5 L6 4.5 L2 7.5 Z"/>
                  </svg>
                ) : null}
              </span>
              <ModuleGlyph type={r.type} active={isActive} />
              <span title={r.label} style={{ fontFamily: benchTokens.mono, fontSize: density.font - 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', minWidth: 0 }}>{r.label}</span>
              <span title={r.type} style={{ marginLeft: 'auto', flexShrink: 0, color: benchTokens.ink4, fontSize: 10.5, fontFamily: benchTokens.mono, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: 80 }}>{r.type}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ModuleGlyph({ type, active }) {
  // Tiny shape indicating module kind
  const shape = type === 'AXICrossbar' ? '⬢' :
                type === 'AXIMaster'   ? '◆' :
                type === 'AXISlave'    ? '■' :
                type === 'AXISystem'   ? '◉' : '·';
  return (
    <span style={{
      width: 12, display: 'inline-flex', justifyContent: 'center',
      color: active ? benchTokens.accent : benchTokens.ink3,
      fontSize: 10,
    }}>{shape}</span>
  );
}

// ─── Schematic (center) ──────────────────────────────────────────────────────
// Block diagram of the current module's children + their wires. Three layout
// modes (hier / orth / dataflow) selectable via the Tweaks panel; bundleMode
// either lets users toggle bundles individually (collapsed) or forces all
// expanded (channel ribbons always on).

const NODE_W = 220, NODE_H = 84;
// Header/port-row layout constants. The backend emits these in
// design.json (layoutConsts) so the values stay in sync with Layout.scala
// (issue #38); we fall back to the historical literals when an older
// design.json without the block is loaded.
// Read at CALL time, not script-eval time: ingest() populates
// window.DESIGN.layoutConsts asynchronously and on every design switch,
// so a module-scope const would be frozen at the fallbacks forever
// (issue #94: that silently defeated #38).
function layoutConstsNow() {
  const lc = (window.DESIGN && window.DESIGN.layoutConsts) || {};
  return {
    HEADER_H: (typeof lc.headerH === 'number') ? lc.headerH : 28,
    PORT_PAD: (typeof lc.portPad === 'number') ? lc.portPad : 18,
    PORT_STEP: (typeof lc.portStep === 'number') ? lc.portStep : 24,
  };
}

// Baked layout from the backend (ELK). Returns boxes, ports, edges, totalW/H
// and a `routingStyle: 'baked'` marker so the wire layer routes along the
// backend polylines.
function bBakedLayout(mod) {
  const all = window.DESIGN && window.DESIGN.layouts;
  if (!all) return null;
  // Structurally-identical modules share one stored layout (issue #31): resolve
  // this module's layout key via layoutOf, falling back to its own name for
  // designs emitted before dedup.
  const key = (window.DESIGN.layoutOf && window.DESIGN.layoutOf[mod.name]) || mod.name;
  const L = all[key];
  if (!L) return null;
  const boxes = {};
  const ports = {};
  L.nodes.forEach((n) => {
    boxes[n.id] = { x: n.x, y: n.y, w: n.w, h: n.h, kind: n.kind };
    ports[n.id] = n.ports;
  });
  const edges = {};
  L.edges.forEach((e) => { edges[e.from + ' ' + e.to] = e.points; });
  return { boxes, ports, edges, totalW: L.w, totalH: L.h, columnLabels: [], routingStyle: 'baked' };
}

// Pick which side of each box a wire enters from based on the relative box
// positions of the two endpoints (closest face). Used for force layouts where
// boxes can be in any relative position.
function bWireEndpoints(ba, bb, fromIdx, toIdx, total) {
  const cax = ba.x + ba.w / 2, cay = ba.y + ba.h / 2;
  const cbx = bb.x + bb.w / 2, cby = bb.y + bb.h / 2;
  const dx = cbx - cax, dy = cby - cay;
  // Stagger when multiple wires share the same face
  const off = total > 1 ? (fromIdx - (total - 1) / 2) * 10 : 0;
  let ax, ay, bx, by;
  if (Math.abs(dx) >= Math.abs(dy)) {
    ax = dx > 0 ? ba.x + ba.w : ba.x;
    ay = cay + off;
    bx = dx > 0 ? bb.x : bb.x + bb.w;
    by = cby + off;
  } else {
    ax = cax + off;
    ay = dy > 0 ? ba.y + ba.h : ba.y;
    bx = cbx + off;
    by = dy > 0 ? bb.y : bb.y + bb.h;
  }
  return { x1: ax, y1: ay, x2: bx, y2: by };
}

function bRoutePath(w, routingStyle) {
  if (w.points && w.points.length >= 2) {
    return 'M ' + w.points.map((p) => `${p[0]} ${p[1]}`).join(' L ');
  }
  if (routingStyle === 'curve') {
    const dx = w.x2 - w.x1, dy = w.y2 - w.y1;
    const horiz = Math.abs(dx) >= Math.abs(dy);
    const cp = Math.max(40, Math.min(180, Math.sqrt(dx * dx + dy * dy) * 0.4));
    if (horiz) {
      return `M ${w.x1} ${w.y1} C ${w.x1 + Math.sign(dx) * cp} ${w.y1}, ${w.x2 - Math.sign(dx) * cp} ${w.y2}, ${w.x2} ${w.y2}`;
    }
    return `M ${w.x1} ${w.y1} C ${w.x1} ${w.y1 + Math.sign(dy) * cp}, ${w.x2} ${w.y2 - Math.sign(dy) * cp}, ${w.x2} ${w.y2}`;
  }
  // orth: out-segment, vertical bend, in-segment
  const mx = (w.x1 + w.x2) / 2;
  return `M ${w.x1} ${w.y1} L ${mx} ${w.y1} L ${mx} ${w.y2} L ${w.x2} ${w.y2}`;
}

function bRouteMidpoint(w, routingStyle) {
  // Where to anchor labels / expand toggles on a routed wire.
  // When the wire has a baked polyline, return a point ON the polyline:
  // pick the vertex pair around the middle index and return their midpoint.
  if (w.points && w.points.length >= 2) {
    const pts = w.points;
    const mid = Math.floor(pts.length / 2);
    // For even lengths, average the two middle vertices; for odd, use the middle vertex.
    const a = pts[mid - (pts.length % 2 === 0 ? 1 : 0)];
    const b = pts[mid];
    return { x: (a[0] + b[0]) / 2, y: (a[1] + b[1]) / 2 };
  }
  if (routingStyle === 'curve') {
    return { x: (w.x1 + w.x2) / 2, y: (w.y1 + w.y2) / 2 };
  }
  return { x: (w.x1 + w.x2) / 2, y: (w.y1 + w.y2) / 2 };
}

// Offset a polyline by a perpendicular distance `o` (px).
// For each interior vertex, averages the normals of the incoming and outgoing segments.
// For endpoints, uses the single adjacent segment's normal.
// Perpendicular of segment (dx,dy): normal = (-dy, dx) normalized.
function offsetPolyline(pts, o) {
  if (!pts || pts.length < 2) return pts;
  const n = pts.length;
  // Compute per-segment unit normals
  const segNormals = [];
  for (let i = 0; i < n - 1; i++) {
    const dx = pts[i + 1][0] - pts[i][0];
    const dy = pts[i + 1][1] - pts[i][1];
    const len = Math.sqrt(dx * dx + dy * dy);
    if (len < 1e-9) { segNormals.push([0, 0]); continue; }
    segNormals.push([-dy / len, dx / len]);
  }
  return pts.map((p, i) => {
    let nx, ny;
    if (i === 0) {
      [nx, ny] = segNormals[0];
    } else if (i === n - 1) {
      [nx, ny] = segNormals[n - 2];
    } else {
      // Average adjacent segment normals
      const [nx0, ny0] = segNormals[i - 1];
      const [nx1, ny1] = segNormals[i];
      const ax = (nx0 + nx1) / 2, ay = (ny0 + ny1) / 2;
      const al = Math.sqrt(ax * ax + ay * ay);
      if (al < 1e-9) { nx = nx0; ny = ny0; }
      else { nx = ax / al; ny = ay / al; }
    }
    return [p[0] + nx * o, p[1] + ny * o];
  });
}

// Wire layers - split into hit-target (under boxes, captures clicks) and
// visual (above boxes, paints stroke+arrowheads). Reusable so the same code
// drives both the top-level schematic and the mini-schematics rendered inside
// expanded module bodies (Task 7 of the inline-expansion plan).
function WireHitLayer({ wires, totalW, totalH, routingStyle, setSelectedSig, setHoveredSig }) {
  return (
    <svg style={{ position: 'absolute', top: 0, left: 0, width: totalW, height: totalH, overflow: 'visible' }}>
      {wires.map((w) => {
        const d = bRoutePath(w, routingStyle);
        return (
          <path key={w.id} d={d} stroke="transparent" strokeWidth={14} fill="none"
            data-pan-block="1" data-wire={w.fromPath}
            style={{ cursor: 'pointer', pointerEvents: 'stroke' }}
            onClick={() => setSelectedSig(w.fromPath)}
            onMouseEnter={() => setHoveredSig(w.fromPath)}
            onMouseLeave={() => setHoveredSig(null)}
          />
        );
      })}
    </svg>
  );
}

function WireVisualLayer({
  wires, totalW, totalH, routingStyle,
  selectedSig, hoveredSig, expandedBundles, toggleBundle, expandedPorts, globalExpanded,
  markerScope,
}) {
  const isHl = (w) => {
    if (!selectedSig) return false;
    return w.fromPath.startsWith(selectedSig) || w.toPath.startsWith(selectedSig)
      || selectedSig.startsWith(w.fromPath) || selectedSig.startsWith(w.toPath);
  };
  const isHov = (w) => {
    if (!hoveredSig) return false;
    return w.fromPath.startsWith(hoveredSig) || w.toPath.startsWith(hoveredSig);
  };
  // markerScope namespaces the <marker> ids so nested SVGs don't collide with
  // the outer SVG's markers. Defaults to 'top'.
  const ms = markerScope || 'top';
  return (
    <svg style={{ position: 'absolute', top: 0, left: 0, width: totalW, height: totalH, pointerEvents: 'none', overflow: 'visible' }}>
      <defs>
        {Object.entries(B_CHAN).map(([k, v]) => (
          <marker key={k} id={`arr-${ms}-${k}`} viewBox="0 0 8 8" refX="4" refY="4" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
            <path d="M0 0 L8 4 L0 8 Z" fill={v} />
          </marker>
        ))}
        <marker id={`arr-${ms}-default`} viewBox="0 0 8 8" refX="4" refY="4" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
          <path d="M0 0 L8 4 L0 8 Z" fill={benchTokens.ink3} />
        </marker>
      </defs>
      {wires.map((w) => {
        const hl  = isHl(w);
        const hov = isHov(w) && !hl; // hover is only meaningful when not already selected
        const dim = selectedSig && !hl;
        // Fan-out ribbons only in the global "Expanded" bundle-display mode.
        // Per-pin expansion (the in-box + chevron) shows the bundle's sub-fields
        // as a tree inside the box but keeps the SINGLE bundle-level wire: a `<>`
        // connection is one connection, so its sub-fields ride one wire and are
        // not individually re-routed (issue #72).
        const exp = globalExpanded;
        // Distinct stroke colors: selection = accent (persistent, strong); hover = ink (transient cue); normal = ink2
        const stroke = dim ? benchTokens.ink4 : hl ? benchTokens.accent : hov ? benchTokens.ink : benchTokens.ink2;
        // Distinct stroke widths: selection = 4 (thick); hover = 3.5 (modest bump); normal = 3
        const sw  = exp ? 1.4 : hl ? 4 : hov ? 3.5 : 3;
        // Halo: selection gets accent glow; hover gets soft ink halo; default is near-invisible
        const haloColor   = hl ? benchTokens.accent : hov ? benchTokens.ink : benchTokens.ink2;
        const haloOpacity = hl ? 0.18 : hov ? 0.10 : 0.07;
        const d   = bRoutePath(w, routingStyle);
        const mid = bRouteMidpoint(w, routingStyle);
        const channels = (B_BUNDLES[w.bundle] && B_BUNDLES[w.bundle].channels) || [];
        return (
          <g key={w.id} style={{ opacity: dim ? 0.32 : 1, transition: 'opacity .15s' }}>
            {!exp && (
              // Halo/glow behind the wire stroke - accent for selected, soft ink for hovered, faint for default
              <path d={d} stroke={haloColor} strokeWidth={sw + 6} fill="none" strokeLinecap="round" strokeLinejoin="round" opacity={haloOpacity} />
            )}
            {exp && channels.length > 0 && (
              <g>
                {channels.map((ch, ci) => {
                  const o = (ci - (channels.length - 1) / 2) * 4;
                  const chColor = B_CHAN[ch.name] || benchTokens.ink3;
                  const markerHref = B_CHAN[ch.name] ? `url(#arr-${ms}-${ch.name})` : `url(#arr-${ms}-default)`;
                  // When the wire has baked polyline points, offset the polyline perpendicularly
                  if (w.points && w.points.length >= 2) {
                    const offsetPts = offsetPolyline(w.points, o);
                    const dd = 'M ' + offsetPts.map((p) => `${p[0]} ${p[1]}`).join(' L ');
                    return <path key={ch.name} d={dd} stroke={dim ? benchTokens.ink4 : chColor} strokeWidth={1.8} fill="none" strokeLinecap="round" strokeLinejoin="round" opacity={dim ? 0.3 : (hl || hov ? 1 : 0.85)} markerEnd={markerHref} />;
                  }
                  // Fallback for non-baked wires
                  if (routingStyle === 'curve') {
                    const dxw = w.x2 - w.x1, dyw = w.y2 - w.y1;
                    const horiz = Math.abs(dxw) >= Math.abs(dyw);
                    let dd;
                    if (horiz) {
                      const cp = Math.max(40, Math.min(180, Math.sqrt(dxw * dxw + dyw * dyw) * 0.4));
                      dd = `M ${w.x1} ${w.y1 + o} C ${w.x1 + Math.sign(dxw) * cp} ${w.y1 + o}, ${w.x2 - Math.sign(dxw) * cp} ${w.y2 + o}, ${w.x2} ${w.y2 + o}`;
                    } else {
                      const cp = Math.max(40, Math.min(180, Math.sqrt(dxw * dxw + dyw * dyw) * 0.4));
                      dd = `M ${w.x1 + o} ${w.y1} C ${w.x1 + o} ${w.y1 + Math.sign(dyw) * cp}, ${w.x2 + o} ${w.y2 - Math.sign(dyw) * cp}, ${w.x2 + o} ${w.y2}`;
                    }
                    return <path key={ch.name} d={dd} stroke={dim ? benchTokens.ink4 : chColor} strokeWidth={1.8} fill="none" strokeLinecap="round" opacity={dim ? 0.3 : 1} markerEnd={markerHref} />;
                  }
                  const yo1 = w.y1 + o;
                  const yo2 = w.y2 + o;
                  const mxo = (w.x1 + w.x2) / 2 + o * 2;
                  const dd = `M ${w.x1} ${yo1} L ${mxo} ${yo1} L ${mxo} ${yo2} L ${w.x2} ${yo2}`;
                  return <path key={ch.name} d={dd} stroke={dim ? benchTokens.ink4 : chColor} strokeWidth={1.8} fill="none" strokeLinecap="round" strokeLinejoin="round" opacity={dim ? 0.3 : 1} markerEnd={markerHref} />;
                })}
              </g>
            )}
            {!exp && (
              <path d={d} stroke={stroke} strokeWidth={sw} fill="none"
                strokeLinecap="round" strokeLinejoin="round"
                markerEnd={`url(#arr-${ms}-default)`}
                markerStart={w.bidir ? `url(#arr-${ms}-default)` : undefined}
              />
            )}
            {/* Per-wire +N pill removed: expand/collapse is now driven by the in-box port chevron (#29) */}
          </g>
        );
      })}
    </svg>
  );
}

function BenchSchematic({ mod, path, selectedSig, setSelectedSig, hoveredSig, setHoveredSig, drillInto, expandedBundles, toggleBundle, expandedPorts, togglePort, tweaks }) {
  // Current layout constants (BenchApp remounts on design switch, so reading
  // them per mount keeps the geometry in sync with the loaded design).
  const { HEADER_H, PORT_PAD, PORT_STEP } = layoutConstsNow();
  const [hoveredInst, setHoveredInst] = useState(null);
  // Pan + zoom on the schematic canvas. Wheel = zoom around cursor;
  // drag-on-background = pan; auto-fit on path / layout change so any size
  // design lands in view at first paint.
  const viewportRef = useRef(null);
  const [zoom, setZoom] = useState(1);
  const [pan, setPan]   = useState({ x: 0, y: 0 });
  const dragRef = useRef(null);

  // Per-path view-state memory: pathKey -> { zoom, pan }.
  // Mirrors of the current zoom/pan as refs so the save-on-navigate effect can
  // read their latest values synchronously (React state reads in effects see the
  // value at the time the effect was scheduled, not at cleanup time).
  const viewStateMapRef = useRef(new Map());
  const zoomRef = useRef(zoom);
  const panRef  = useRef(pan);
  useEffect(() => { zoomRef.current = zoom; }, [zoom]);
  useEffect(() => { panRef.current  = pan;  }, [pan]);

  const layoutResult = useMemo(() => bBakedLayout(mod), [mod]);
  const { boxes: layoutBoxes, ports: layoutPorts, totalW, totalH, routingStyle, edges: bakedEdges } = layoutResult || { boxes: {}, ports: {}, totalW: 1, totalH: 1, routingStyle: 'baked', edges: {} };
  const containerH = totalH + 40;

  // On path change: save the old path's zoom/pan, then restore or auto-fit for
  // the new path. First visit auto-fits; revisit restores the saved state.
  const pathKey = path.join('/');
  const prevPathKeyRef = useRef(null);
  useEffect(() => {
    const vp = viewportRef.current;
    if (!vp || totalW <= 0 || containerH <= 0) return;

    // Save departing path's view state (skip on the very first render where
    // there is no previous path yet).
    const prev = prevPathKeyRef.current;
    if (prev !== null && prev !== pathKey) {
      viewStateMapRef.current.set(prev, { zoom: zoomRef.current, pan: panRef.current });
    }
    prevPathKeyRef.current = pathKey;

    const saved = viewStateMapRef.current.get(pathKey);
    if (saved) {
      // Revisit: restore the previously saved view state.
      setZoom(saved.zoom);
      setPan(saved.pan);
    } else {
      // First visit: auto-fit so any size design lands in view.
      const w = vp.clientWidth, h = vp.clientHeight;
      if (w <= 0 || h <= 0) return;
      const margin = 40;
      const z = Math.min(1, (w - 2 * margin) / totalW, (h - 2 * margin) / containerH);
      setZoom(z);
      setPan({ x: (w - totalW * z) / 2, y: (h - containerH * z) / 2 });
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pathKey, totalW, containerH]);

  // Wheel-to-zoom anchored at the cursor. Attached non-passively so we can
  // preventDefault and stop the page from scrolling under the schematic.
  useEffect(() => {
    const vp = viewportRef.current;
    if (!vp) return;
    const onWheel = (e) => {
      e.preventDefault();
      const rect = vp.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      setZoom((z) => {
        const newZ = Math.max(0.08, Math.min(4, z * Math.exp(-e.deltaY * 0.0015)));
        const ratio = newZ / z;
        setPan((p) => ({ x: mx - (mx - p.x) * ratio, y: my - (my - p.y) * ratio }));
        return newZ;
      });
    };
    vp.addEventListener('wheel', onWheel, { passive: false });
    return () => vp.removeEventListener('wheel', onWheel);
  }, []);

  // Drag-to-pan. Triggers on left-click background OR any middle-click.
  // A `data-pan-block` attribute on boxes / wire hit-paths / bundle pills
  // keeps their own clicks intact (they don't bubble into pan).
  const handlePanStart = (e) => {
    const isMiddle = e.button === 1;
    const isLeftOnBg = e.button === 0 && !(e.target.closest && e.target.closest('[data-pan-block]'));
    if (!isMiddle && !isLeftOnBg) return;
    e.preventDefault();
    const start = { x: e.clientX, y: e.clientY, panX: pan.x, panY: pan.y };
    dragRef.current = start;
    const vp = viewportRef.current;
    if (vp) vp.style.cursor = 'grabbing';
    const onMove = (ev) => {
      if (!dragRef.current) return;
      setPan({ x: start.panX + (ev.clientX - start.x), y: start.panY + (ev.clientY - start.y) });
    };
    const onUp = () => {
      dragRef.current = null;
      if (vp) vp.style.cursor = '';
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  };

  const fitToView = useCallback(() => {
    const vp = viewportRef.current;
    if (!vp || totalW <= 0 || containerH <= 0) return;
    const margin = 40;
    const w = vp.clientWidth, h = vp.clientHeight;
    const z = Math.min(1, (w - 2 * margin) / totalW, (h - 2 * margin) / containerH);
    setZoom(z);
    setPan({ x: (w - totalW * z) / 2, y: (h - containerH * z) / 2 });
  }, [totalW, containerH]);

  const zoomBy = (factor) => {
    const vp = viewportRef.current;
    if (!vp) { setZoom((z) => Math.max(0.08, Math.min(4, z * factor))); return; }
    const cx = vp.clientWidth / 2, cy = vp.clientHeight / 2;
    setZoom((z) => {
      const newZ = Math.max(0.08, Math.min(4, z * factor));
      const ratio = newZ / z;
      setPan((p) => ({ x: cx - (cx - p.x) * ratio, y: cy - (cy - p.y) * ratio }));
      return newZ;
    });
  };

  // CHIRRTL emits both directions of every Decoupled handshake (bits forward,
  // ready back), so the coalesced wire list almost always has matched pairs
  // A→B and B→A. We fold them into one bidirectional wire (rendered as a
  // double-headed arrow) so the schematic reads as Chisel-level connects, not
  // ground-signal flow. Same-direction same-pair wires are kept (only true
  // reverse pairs collapse).
  const displayWires = useMemo(() => {
    if (tweaks.collapseBidir === false) return mod.wires;
    const pairKey = (a, b) => (a < b ? a + '|' + b : b + '|' + a);
    const seen = new Map();   // pairKey -> array of wires in that bucket
    const out  = [];
    const getCount = (label) => {
      const m = /(\d+)\s*\u00d7/.exec(label || '');
      return m ? parseInt(m[1], 10) : 1;
    };
    for (const w of mod.wires) {
      const a = (w.from || '').split('.')[0];
      const b = (w.to   || '').split('.')[0];
      if (!a || !b || a === b) { out.push(w); continue; }
      const k = pairKey(a, b);
      const peers = seen.get(k) || [];
      // Look for a peer wire pointing the opposite direction.
      const reverse = peers.find((p) => p.from.split('.')[0] === b && p.to.split('.')[0] === a);
      if (reverse) {
        // Promote the existing wire to bidirectional + accumulate ground count.
        reverse.bidir  = true;
        reverse.count  = (reverse.count || getCount(reverse.label)) + getCount(w.label);
        // Prefer the more specific bundle name over the generic "Wire"
        if (reverse.bundle === 'Wire' && w.bundle && w.bundle !== 'Wire') reverse.bundle = w.bundle;
        reverse.label  = reverse.count > 1 ? reverse.count + '\u00d7 ground (bidir)' : 'bidirectional';
        continue;
      }
      const fresh = { ...w };
      peers.push(fresh);
      seen.set(k, peers);
      out.push(fresh);
    }
    return out;
  }, [mod.wires, tweaks.collapseBidir]);

  // Build the ordered row lists for each box (west + east), expanding any
  // ports that are in expandedPorts. Returns {westRows, eastRows, boxH} per inst.
  // Each row: {depth, label, dir, width, path, bundleKey, isExpandable, isTopLevel, side}
  const boxRowsMap = useMemo(() => {
    const result = {};
    for (const [inst, b] of Object.entries(layoutBoxes)) {
      // Boundary stubs are fixed-size, not expandable, and their pins are
      // ELK-placed: the row-based pin-Y override must never apply to them
      // (issue #95: it detached wires from the 28px stubs).
      if (b.kind === 'boundary') continue;
      const instChild = mod.children.find((c) => c.name === inst);
      const ports = (layoutPorts && layoutPorts[inst]) || [];
      const topLevelPorts = ports.filter((p) => !p.bundle || true); // all top-level pins

      const buildRows = (side) => {
        const rows = [];
        // Dedup by path: a box can carry overlapping pins (e.g. the whole `io`
        // bundle AND a sub-path `io.in`), so expanding both would emit the same
        // sub-row twice and collide on the React key. First path wins.
        const seen = new Set();
        const pushRow = (row) => { if (seen.has(row.path)) return false; seen.add(row.path); rows.push(row); return true; };
        for (const p of topLevelPorts) {
          if (p.side !== side) continue;
          // Top-level row
          const added = pushRow({
            depth: 0, label: p.label || p.path, dir: null, width: 0,
            path: p.path, bundleKey: p.bundle || '', isExpandable: isAggregateType(p.bundle),
            isTopLevel: true, side, pinX: p.x - b.x, pinY_baked: p.y - b.y,
          });
          if (!added) continue;
          // If this port is expanded, splice in children (and their expanded children)
          if (p.bundle && expandedPorts.has(p.path)) {
            // The pin's true direction comes from the instance type's port
            // declaration (issue #85: null here rendered wrong/missing arrows).
            const baseDir = instChild ? resolvePinDir(instChild.type, p.path) : null;
            const tree = portTree(p.bundle, baseDir, p.path);
            const addChildren = (children, depth) => {
              for (const child of children) {
                const ok = pushRow({
                  depth, label: child.name, dir: child.dir, width: child.width,
                  path: child.path, bundleKey: child.bundleKey, isExpandable: child.isExpandable,
                  isTopLevel: false, side,
                });
                if (ok && child.isExpandable && expandedPorts.has(child.path)) {
                  const subTree = portTree(child.bundleKey, child.dir, child.path);
                  addChildren(subTree.children, depth + 1);
                }
              }
            };
            addChildren(tree.children, 1);
          }
        }
        return rows;
      };

      const westRows = buildRows('WEST');
      const eastRows = buildRows('EAST');
      const numRows = Math.max(1, Math.max(westRows.length, eastRows.length));
      const boxH = HEADER_H + 2 * PORT_PAD + numRows * PORT_STEP;
      result[inst] = { westRows, eastRows, boxH };
    }
    return result;
  }, [layoutBoxes, layoutPorts, expandedPorts, mod]);

  // pinY[inst][portPath] = current y within box (box-relative).
  // Used to override wire endpoint y so wires stay attached when rows expand.
  const pinY = useMemo(() => {
    const result = {};
    for (const [inst, { westRows, eastRows }] of Object.entries(boxRowsMap)) {
      result[inst] = {};
      const processRows = (rows) => {
        rows.forEach((row, idx) => {
          if (row.isTopLevel) {
            result[inst][row.path] = HEADER_H + PORT_PAD + idx * PORT_STEP + PORT_STEP / 2;
          }
        });
      };
      processRows(westRows);
      processRows(eastRows);
    }
    return result;
  }, [boxRowsMap]);

  // Wires with absolute endpoints. We compute per-instance fan-out indexing
  // so wires sharing a face are staggered (avoids overlap on dense modules).
  const wires = useMemo(() => {
    // Count wires per (instance, role) to compute stagger offsets.
    const fanOut = {}, fanIn = {};
    displayWires.forEach((w) => {
      const a = w.from.split('.')[0], b = w.to.split('.')[0];
      fanOut[a] = (fanOut[a] || 0) + 1;
      fanIn[b]  = (fanIn[b]  || 0) + 1;
    });
    const idxOut = {}, idxIn = {};
    return displayWires.map((w, i) => {
      const fromInst = w.from.split('.')[0];
      const toInst   = w.to.split('.')[0];
      if (routingStyle === 'baked') {
        const pts = bakedEdges && bakedEdges[w.from + ' ' + w.to];
        if (!pts || pts.length < 2) return null;
        // Override terminal y-coordinates if the port has shifted due to row expansion.
        // The baked x stays; only y changes (pins move vertically as rows expand above them).
        // NOTE: in RoutedEdge, points run source->sink (w.to->w.from), so:
        //   pts[0] = w.to endpoint (source)
        //   pts[last] = w.from endpoint (sink)
        const fromBox = layoutBoxes[fromInst];
        const toBox   = layoutBoxes[toInst];
        // toPinY overrides pts[0] (= w.to = source endpoint)
        const toPinY = (pinY[toInst] && pinY[toInst][w.to] != null)
          ? (toBox ? toBox.y + pinY[toInst][w.to] : pts[0][1]) : pts[0][1];
        // fromPinY overrides pts[last] (= w.from = sink endpoint)
        const fromPinY = (pinY[fromInst] && pinY[fromInst][w.from] != null)
          ? (fromBox ? fromBox.y + pinY[fromInst][w.from] : pts[pts.length - 1][1]) : pts[pts.length - 1][1];
        // Rebuild the points array with updated first/last y only.
        const newPts = pts.map((p, idx) => {
          if (idx === 0) return [p[0], toPinY];
          if (idx === pts.length - 1) return [p[0], fromPinY];
          return p;
        });
        return {
          id: `w${i}`, ...w, fromInst, toInst,
          fromPath: w.from, toPath: w.to,
          points: newPts,
          x1: newPts[0][0], y1: newPts[0][1],
          x2: newPts[newPts.length - 1][0], y2: newPts[newPts.length - 1][1],
        };
      }
      const ba = layoutBoxes[fromInst];
      const bb = layoutBoxes[toInst];
      if (!ba || !bb) return null;
      const fIdx = (idxOut[fromInst] = (idxOut[fromInst] || 0) + 1) - 1;
      const tIdx = (idxIn[toInst]   = (idxIn[toInst]   || 0) + 1) - 1;
      const pts = bWireEndpoints(ba, bb, fIdx, fanOut[fromInst]);
      return {
        id: `w${i}`, ...w,
        fromInst, toInst,
        fromPath: w.from, toPath: w.to,
        ...pts,
      };
    }).filter(Boolean);
  }, [displayWires, layoutBoxes, bakedEdges, routingStyle, pinY]);

  const isHighlighted = (wire) => {
    if (!selectedSig) return false;
    return wire.fromPath.startsWith(selectedSig) || wire.toPath.startsWith(selectedSig) ||
           selectedSig.startsWith(wire.fromPath) || selectedSig.startsWith(wire.toPath);
  };
  const isHovered = (wire) => {
    if (!hoveredSig) return false;
    return wire.fromPath.startsWith(hoveredSig) || wire.toPath.startsWith(hoveredSig);
  };

  // Global bundle-mode: when "expanded", every wire renders as channel ribbons
  // regardless of individual toggles; the per-wire expand pill is hidden.
  const globalExpanded = tweaks.bundleMode === 'expanded';

  return (
    <div style={{ flex: 1, position: 'relative', overflow: 'hidden', background: `radial-gradient(circle at 1px 1px, ${benchTokens.border} 1px, transparent 0) 0 0/20px 20px, ${benchTokens.bg}` }}>
      {/* Canvas chrome */}
      <div style={{ position: 'absolute', top: 12, left: 12, right: 12, display: 'flex', alignItems: 'center', justifyContent: 'space-between', zIndex: 2, pointerEvents: 'none' }}>
        <div style={{ display: 'flex', gap: 6, pointerEvents: 'auto' }}>
          <div style={{ background: benchTokens.panel, border: `1px solid ${benchTokens.border}`, borderRadius: 5, padding: '4px 10px', fontSize: 11, color: benchTokens.ink2, display: 'flex', alignItems: 'center', gap: 6, fontFamily: benchTokens.mono }}>
            <span style={{ color: benchTokens.ink4 }}>module</span>
            <span style={{ color: benchTokens.ink }}>{mod.type}</span>
          </div>
          <div style={{ background: benchTokens.panel, border: `1px solid ${benchTokens.border}`, borderRadius: 5, padding: '4px 10px', fontSize: 11, color: benchTokens.ink3, fontFamily: benchTokens.mono }}>
            {mod.children.length} inst · {mod.wires.length} connects
          </div>
        </div>
      </div>

      <div ref={viewportRef}
           onMouseDown={handlePanStart}
           style={{
             position: 'absolute', inset: 0, overflow: 'hidden',
             cursor: dragRef.current ? 'grabbing' : 'grab',
             touchAction: 'none',
           }}>
        <div style={{
          position: 'absolute', left: 0, top: 0,
          width: totalW, height: containerH,
          transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`,
          transformOrigin: '0 0',
          transition: 'width .3s, height .3s',
        }}>
          {/* Wires - HIT-TARGET layer (rendered before boxes so boxes paint above arrowhead-bearing strokes) */}
          <WireHitLayer
            wires={wires} totalW={totalW} totalH={containerH}
            routingStyle={routingStyle}
            setSelectedSig={setSelectedSig} setHoveredSig={setHoveredSig}
          />

          {/* Module boxes */}
          {Object.entries(layoutBoxes).map(([inst, b]) => {
            const child = mod.children.find((c) => c.name === inst);
            // Boundary nodes (clock/reset/port stubs from baked layout) - render
            // as a small labeled stub box rather than skipping them.
            if (!child || b.kind === 'boundary') {
              return (
                <div key={inst}
                  data-pan-block="1"
                  data-boundary-stub={inst}
                  title={inst}
                  style={{
                    position: 'absolute', left: b.x, top: b.y, width: b.w, height: b.h,
                    background: benchTokens.panelAlt,
                    border: `1px dashed ${benchTokens.border}`,
                    borderRadius: 4,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontFamily: benchTokens.mono, fontSize: 9.5, color: benchTokens.ink3,
                    overflow: 'hidden',
                    // Hoverable so the path tooltip works and the stub can be
                    // inspected; data-pan-block keeps panning off it (issue #95:
                    // pointerEvents none made boundary ports uninspectable).
                    pointerEvents: 'auto',
                    cursor: 'default',
                  }}
                  onClick={() => setSelectedSig(inst)}
                  >
                  {/* Each external pin is its own stub now (issue #68); the pin
                      label beside the connector already names the port, so only
                      show a centered id for label-less stubs to avoid duplication. */}
                  {!(layoutPorts && layoutPorts[inst] && layoutPorts[inst].some((p) => p.label)) && (
                    <span style={{ padding: '0 6px', textAlign: 'center', wordBreak: 'break-all' }}>{inst}</span>
                  )}
                  {layoutPorts && layoutPorts[inst] && layoutPorts[inst].map((p) => {
                    // Interface pins: fat connector glyph (accent, 8x12, rounded); ground pins: thin tick (ink4, 3x6)
                    const pw = p.interface ? 8 : 3;
                    const ph = p.interface ? 12 : 6;
                    const lbl = p.label || '';
                    const isWest = p.side === 'WEST';
                    return (
                      <React.Fragment key={p.path}>
                        <div
                          title={p.path}
                          style={{
                            position: 'absolute',
                            left: (p.x - b.x) - pw / 2,
                            top:  (p.y - b.y) - ph / 2,
                            width: pw, height: ph,
                            background: p.interface ? benchTokens.accent : benchTokens.ink4,
                            borderRadius: p.interface ? 3 : 1,
                            outline: p.interface ? `1.5px solid ${benchTokens.accentLine}` : 'none',
                            outlineOffset: p.interface ? '1px' : '0',
                          }} />
                        {lbl && (
                          <span style={{
                            position: 'absolute',
                            top:  (p.y - b.y) - 5,
                            ...(isWest
                              ? { left: pw + 3, textAlign: 'left' }
                              : { right: pw + 3, textAlign: 'right' }),
                            fontFamily: benchTokens.mono,
                            fontSize: 8.5,
                            color: p.interface ? benchTokens.ink2 : benchTokens.ink3,
                            whiteSpace: 'nowrap',
                            pointerEvents: 'none',
                            // Stubs can be 16px wide: never emit a negative width.
                            maxWidth: Math.max(12, b.w - pw - 8),
                            overflow: 'hidden',
                            textOverflow: 'ellipsis',
                            lineHeight: '10px',
                          }}>{lbl}</span>
                        )}
                      </React.Fragment>
                    );
                  })}
                </div>
              );
            }
            const childMod = B_MODULES[child.type];
            // Blackbox = external (extmodule) or intrinsic (intmodule): no
            // internals, render distinctly and skip drilldown (issue #20).
            const isBlackbox = !!childMod && (childMod.kind === 'external' || childMod.kind === 'intrinsic');
            const drillable = !!childMod && !isBlackbox && childMod.children.length > 0;
            const wiresOnMe = wires.filter((w) => w.fromInst === inst || w.toInst === inst);
            const selectedHere = selectedSig && (selectedSig.startsWith(inst + '.') || selectedSig === inst);
            const boxInfo = boxRowsMap[inst] || { westRows: [], eastRows: [], boxH: b.h };
            const effectiveH = boxInfo.boxH;
            // Build merged rows for WEST and EAST side rendering inside the box.
            // Each row renders at y = HEADER_H + PORT_PAD + rowIdx * PORT_STEP + PORT_STEP/2.
            const renderPortRows = (rows, side) => {
              const isWest = side === 'WEST';
              return rows.map((row, rowIdx) => {
                const rowY = HEADER_H + PORT_PAD + rowIdx * PORT_STEP + PORT_STEP / 2;
                const indentPx = row.depth * 8;
                const chevronColor = row.isExpandable ? benchTokens.ink2 : benchTokens.ink4;
                if (row.isTopLevel) {
                  // Top-level port: edge pin glyph + label + optional chevron
                  // Interface (aggregate/bundle) pins = fat connector; ground (scalar) pins = thin tick
                  const isInterface = row.isExpandable;
                  const pw = isInterface ? 8 : 3;
                  const ph = isInterface ? 12 : 6;
                  const pinAbsX = isWest ? 0 : b.w;
                  const pinLeft = pinAbsX - pw / 2;
                  // Pin highlight when its wire is selected or hovered
                  const pinSelected = selectedSig && (row.path.startsWith(selectedSig) || selectedSig.startsWith(row.path));
                  const pinHovered  = !pinSelected && hoveredSig && (row.path.startsWith(hoveredSig) || hoveredSig.startsWith(row.path));
                  const pinBg = pinSelected ? benchTokens.accent
                    : pinHovered ? benchTokens.ink
                    : isInterface ? benchTokens.accent : benchTokens.ink3;
                  return (
                    <React.Fragment key={row.path + ':' + rowIdx}>
                      {/* Edge pin glyph - interface = fat connector; ground = thin tick */}
                      <div title={row.path} style={{
                        position: 'absolute',
                        left: pinLeft, top: rowY - ph / 2,
                        width: pw, height: ph,
                        background: pinBg,
                        borderRadius: isInterface ? 3 : 1,
                        outline: isInterface ? `1.5px solid ${benchTokens.accentLine}` : 'none',
                        outlineOffset: isInterface ? '1px' : '0',
                        transition: 'background .12s',
                      }} />
                      {/* Label + optional chevron. The row is confined to its
                          side's half of the box: anchoring to BOTH edges made
                          every row span the full width, flushing glyphs into
                          the opposite column and overlapping the other side's
                          rows (issue #85). Chevron sits on the pin side. */}
                      <div data-pan-block="1"
                        data-bundle-toggle={row.isExpandable ? row.path : undefined}
                        style={{
                        position: 'absolute',
                        top: rowY - 8,
                        ...(isWest
                          ? { left: pw + 4 + indentPx }
                          : { right: pw + 4 + indentPx }),
                        width: Math.max(24, b.w / 2 - (pw + 4 + indentPx) - 4),
                        display: 'flex', alignItems: 'center',
                        flexDirection: isWest ? 'row' : 'row-reverse',
                        justifyContent: 'flex-start',
                        gap: 3, height: 16,
                        fontFamily: benchTokens.mono, fontSize: 8.5,
                        color: benchTokens.ink2,
                        whiteSpace: 'nowrap', overflow: 'hidden',
                        pointerEvents: row.isExpandable ? 'auto' : 'none',
                        cursor: row.isExpandable ? 'pointer' : 'default',
                      }}
                        onClick={row.isExpandable ? (e) => { e.stopPropagation(); togglePort(row.path); } : undefined}
                      >
                        {row.isExpandable && (
                          <span style={{ flexShrink: 0, color: chevronColor, fontSize: 8, lineHeight: 1 }}>
                            {expandedPorts.has(row.path) ? '−' : '+'}
                          </span>
                        )}
                        <span title={row.path} style={{ overflow: 'hidden', textOverflow: 'ellipsis', minWidth: 0, flexShrink: 1 }}>{row.label}</span>
                      </div>
                    </React.Fragment>
                  );
                } else {
                  // Sub-row: indented label + optional chevron + dir arrow + width badge. No edge pin.
                  const chColor = B_CHAN[row.label] || benchTokens.ink3;
                  const hasChannelColor = !!B_CHAN[row.label];
                  return (
                    <div key={row.path + ':' + rowIdx} data-pan-block="1"
                      data-bundle-toggle={row.isExpandable ? row.path : undefined}
                      style={{
                      position: 'absolute',
                      top: rowY - 8,
                      ...(isWest
                        ? { left: 12 + indentPx }
                        : { right: 12 + indentPx }),
                      width: Math.max(24, b.w / 2 - (12 + indentPx) - 4),
                      display: 'flex', alignItems: 'center',
                      flexDirection: isWest ? 'row' : 'row-reverse',
                      justifyContent: 'flex-start',
                      gap: 3, height: 16,
                      fontFamily: benchTokens.mono, fontSize: 8,
                      color: hasChannelColor ? chColor : benchTokens.ink3,
                      whiteSpace: 'nowrap', overflow: 'hidden',
                      cursor: row.isExpandable ? 'pointer' : 'default',
                      pointerEvents: row.isExpandable ? 'auto' : 'none',
                    }}
                      onClick={row.isExpandable ? (e) => { e.stopPropagation(); togglePort(row.path); } : undefined}
                    >
                      {/* Chevron at the pin edge, then dot + name; dir arrow and
                          width badge sit inward of the name, never in the other
                          side's column (issue #85). */}
                      {row.isExpandable && (
                        <span style={{ flexShrink: 0, color: benchTokens.ink4, fontSize: 8 }}>
                          {expandedPorts.has(row.path) ? '−' : '+'}
                        </span>
                      )}
                      {hasChannelColor && <span style={{ width: 5, height: 5, borderRadius: '50%', background: chColor, flexShrink: 0 }} />}
                      <span title={row.path} style={{ overflow: 'hidden', textOverflow: 'ellipsis', minWidth: 0, flexShrink: 1 }}>{row.label}</span>
                      {row.dir && (
                        <span style={{ flexShrink: 0, color: benchTokens.ink4, fontSize: 7 }}>
                          {row.dir === 'out' ? '→' : '←'}
                        </span>
                      )}
                      {row.width > 0 && (
                        <span style={{ flexShrink: 0, color: benchTokens.ink4, fontSize: 7 }}>{row.width}b</span>
                      )}
                    </div>
                  );
                }
              });
            };
            return (
              <div key={inst}
                data-pan-block="1"
                data-box-inst={inst}
                data-box-drillable={drillable ? '1' : '0'}
                onMouseEnter={() => setHoveredInst(inst)}
                onMouseLeave={() => setHoveredInst((cur) => (cur === inst ? null : cur))}
                onDoubleClick={() => drillable && drillInto(inst)}
                style={{
                  position: 'absolute', left: b.x, top: b.y, width: b.w, height: effectiveH,
                  background: benchTokens.panel,
                  border: `1px ${isBlackbox ? 'dashed' : 'solid'} ${selectedHere ? benchTokens.accent : benchTokens.border}`,
                  borderRadius: 6,
                  boxShadow: selectedHere ? `0 0 0 3px ${benchTokens.accentBg}` : '0 1px 2px rgba(0,0,0,.04)',
                  cursor: drillable ? 'pointer' : 'default',
                  display: 'flex', flexDirection: 'column',
                  overflow: 'visible',
                  transition: 'box-shadow .12s, border-color .12s',
                }}
              >
                <div style={{ height: HEADER_H, boxSizing: 'border-box', padding: '0 10px', borderBottom: `1px ${isBlackbox ? 'dashed' : 'solid'} ${benchTokens.borderSoft}`, display: 'flex', alignItems: 'center', gap: 6, background: benchTokens.panelAlt, flexShrink: 0, minWidth: 0, overflow: 'hidden' }}>
                  <ModuleGlyph type={child.type} active={selectedHere} />
                  <span title={inst} style={{ fontFamily: benchTokens.mono, fontSize: 11.5, fontWeight: 600, color: benchTokens.ink, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', minWidth: 0 }}>{inst}</span>
                  <div style={{ marginLeft: 'auto', flexShrink: 0, display: 'flex', alignItems: 'center', gap: 6 }}>
                    {isBlackbox && (
                      <span title={`${child.type} is a blackbox (${childMod.kind}): no internals`}
                            style={{ fontFamily: benchTokens.mono, fontSize: 8, fontWeight: 600, letterSpacing: 0.4, textTransform: 'uppercase', color: benchTokens.ink3, background: benchTokens.panel, border: `1px dashed ${benchTokens.border}`, borderRadius: 3, padding: '0 4px', lineHeight: '13px' }}>
                        {childMod.kind === 'intrinsic' ? 'intrinsic' : 'ext'}
                      </span>
                    )}
                    <span title={child.type} style={{ fontFamily: benchTokens.mono, fontSize: 10, color: benchTokens.ink3, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: 80 }}>{child.type}</span>
                    {drillable && (
                      <span style={{ fontFamily: benchTokens.mono, fontSize: 9, color: benchTokens.accent }}>{'↵'}</span>
                    )}
                  </div>
                </div>
                {/* Port rows: rendered absolutely within box, below header */}
                {renderPortRows(boxInfo.westRows, 'WEST')}
                {renderPortRows(boxInfo.eastRows, 'EAST')}
              </div>
            );
          })}

          {/* Wires - VISUAL layer (rendered after boxes so stroke + arrowheads paint above box borders) */}
          <WireVisualLayer
            wires={wires} totalW={totalW} totalH={containerH}
            routingStyle={routingStyle}
            selectedSig={selectedSig} hoveredSig={hoveredSig}
            expandedBundles={expandedBundles} toggleBundle={toggleBundle}
            expandedPorts={expandedPorts}
            globalExpanded={globalExpanded}
            markerScope="top"
          />
        </div>

        {/* Missing-layout notice: a module we cannot find baked geometry for
            must say so loudly instead of silently rendering an empty canvas
            (issue #87: this is how the layoutOf regression went unnoticed). */}
        {layoutResult === null && (mod.children.length > 0 || (mod.ports || []).length > 0) && (
          <div style={{
            position: 'absolute', inset: 0,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            pointerEvents: 'none',
          }}>
            <span data-layout-missing="1" style={{
              fontFamily: benchTokens.mono, fontSize: 12,
              color: benchTokens.warn || benchTokens.ink2,
              letterSpacing: 0.3,
              whiteSpace: 'nowrap',
            }}>No layout data for {mod.name}: re-export design.json with a current socless version.</span>
          </div>
        )}

        {/* Empty-module placeholder - only when there is truly nothing drawn
            (issue #93: it used to render over boundary stubs and wires). */}
        {layoutResult !== null && mod.children.length === 0 && Object.keys(layoutBoxes).length === 0 && (
          <div style={{
            position: 'absolute', inset: 0,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            pointerEvents: 'none',
          }}>
            <span data-empty-module="1" style={{
              fontFamily: benchTokens.mono, fontSize: 12,
              color: benchTokens.ink4,
              letterSpacing: 0.3,
              whiteSpace: 'nowrap',
            }}>This module has no instances, ports, or wires to display.</span>
          </div>
        )}
      </div>

      {/* Zoom controls (bottom-right, outside the pan/zoom viewport so they don't transform). */}
      <div style={{
        position: 'absolute', bottom: 12, right: 12, zIndex: 3,
        display: 'flex', alignItems: 'center', gap: 2,
        background: benchTokens.panel, border: `1px solid ${benchTokens.border}`,
        borderRadius: 5, padding: 2, fontFamily: benchTokens.mono, fontSize: 11,
      }}>
        <button onClick={fitToView} title="Fit to view" style={zoomBtnStyle}>fit</button>
        <button onClick={() => zoomBy(0.8)} title="Zoom out (or mouse wheel down)" style={zoomBtnStyle}>−</button>
        <span style={{ padding: '3px 6px', color: benchTokens.ink2, minWidth: 38, textAlign: 'center' }}>{Math.round(zoom * 100)}%</span>
        <button onClick={() => zoomBy(1.25)} title="Zoom in (or mouse wheel up)" style={zoomBtnStyle}>+</button>
        <button onClick={() => { setZoom(1); setPan({ x: 40, y: 40 }); }} title="Reset to 100%" style={zoomBtnStyle}>1:1</button>
      </div>
    </div>
  );
}

// ─── Inspector (right) ───────────────────────────────────────────────────────
function BenchInspector({ mod, selectedSig, hoveredSig, setSelectedSig, expandedBundles, toggleBundle, density }) {
  const sig = selectedSig || hoveredSig;
  const wire = sig ? mod.wires.find((w) => w.from === sig || w.to === sig || sig.startsWith(w.from + '.') || sig.startsWith(w.to + '.')) : null;

  return (
    <div style={{ width: 304, flexShrink: 0, background: benchTokens.panel, overflowY: 'auto', display: 'flex', flexDirection: 'column' }}>
      <div style={{ padding: '10px 14px 8px', borderBottom: `1px solid ${benchTokens.borderSoft}`, fontSize: 10.5, fontWeight: 600, color: benchTokens.ink3, letterSpacing: 0.6, textTransform: 'uppercase', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <span>Inspector</span>
        {sig && <button onClick={() => setSelectedSig(null)} style={{ border: 'none', background: 'transparent', color: benchTokens.ink3, fontSize: 11, cursor: 'pointer', textTransform: 'none', letterSpacing: 0 }}>clear</button>}
      </div>
      {!sig && (
        <div style={{ padding: '24px 16px', color: benchTokens.ink3, fontSize: 12, lineHeight: 1.55 }}>
          <div style={{ marginBottom: 12, fontWeight: 500, color: benchTokens.ink2 }}>{mod.type}</div>
          <div style={{ marginBottom: 16, fontSize: 11.5 }}>{mod.doc}</div>
          <InspectorMeta mod={mod} />
          <div style={{ marginTop: 14, color: benchTokens.ink4, fontSize: 11 }}>Click a wire or module to inspect.</div>
        </div>
      )}
      {sig && wire && (
        <InspectorBundle wire={wire} sig={sig} expandedBundles={expandedBundles} toggleBundle={toggleBundle} setSelectedSig={setSelectedSig} />
      )}
    </div>
  );
}

function InspectorMeta({ mod }) {
  const items = [
    ['Type',      mod.type],
    ['Instances', mod.children.length],
    // mod.wires are coalesced connect groups (literal tie-offs included),
    // not drawn wires: label them honestly (issue #97).
    ['Connects',  mod.wires.length],
    ...(mod.metrics.gates != null ? [['Gates', mod.metrics.gates.toLocaleString()]] : []),
    ['Registers', mod.metrics.registers],
    ...(mod.metrics.memories != null ? [['Memories', mod.metrics.memories]] : []),
    ['LOC',       mod.metrics.lines],
  ];
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '90px 1fr', rowGap: 5, columnGap: 8, fontFamily: benchTokens.mono, fontSize: 11 }}>
      {items.map(([k, v]) => (
        <React.Fragment key={k}>
          <span style={{ color: benchTokens.ink4 }}>{k}</span>
          <span style={{ color: benchTokens.ink2 }}>{v}</span>
        </React.Fragment>
      ))}
    </div>
  );
}

function CopyPathBtn({ path }) {
  const [copied, setCopied] = React.useState(false);
  function handleCopy(e) {
    e.stopPropagation();
    navigator.clipboard.writeText(path).then(() => {
      setCopied(true);
      if (window.__soclessToast) window.__soclessToast('✓ Copied: ' + path, 'ok', 1800);
      setTimeout(() => setCopied(false), 1400);
    }).catch(() => {
      if (window.__soclessToast) window.__soclessToast('Copy failed', 'err', 1800);
    });
  }
  return (
    <button
      onClick={handleCopy}
      title={'Copy path: ' + path}
      style={{
        border: 'none', background: 'transparent', cursor: 'pointer',
        padding: '1px 3px', borderRadius: 3, lineHeight: 1,
        color: copied ? benchTokens.ok : benchTokens.ink4,
        fontSize: 10, flexShrink: 0,
        transition: 'color .15s',
      }}
      onMouseEnter={(e) => { e.currentTarget.style.color = copied ? benchTokens.ok : benchTokens.ink2; e.currentTarget.style.background = benchTokens.panelAlt; }}
      onMouseLeave={(e) => { e.currentTarget.style.color = copied ? benchTokens.ok : benchTokens.ink4; e.currentTarget.style.background = 'transparent'; }}
    >
      {copied ? '✓' : '\u{1F4CB}'}
    </button>
  );
}

function InspectorBundle({ wire, sig, expandedBundles, toggleBundle, setSelectedSig }) {
  // Build the port tree from the wire's bundle type, rooted at wire.from.
  const tree = useMemo(() => portTree(wire.bundle, null, wire.from), [wire.bundle, wire.from]);

  return (
    <div style={{ padding: '12px 14px', fontSize: 12, overflow: 'auto' }}>
      <div style={{ marginBottom: 10 }}>
        <div style={{ fontFamily: benchTokens.mono, fontSize: 12, fontWeight: 600, color: benchTokens.ink, marginBottom: 2, display: 'flex', alignItems: 'center', gap: 4 }}>
          <span title={wire.from} style={{ flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{wire.from}</span>
          <CopyPathBtn path={wire.from} />
        </div>
        <div style={{ fontFamily: benchTokens.mono, fontSize: 10.5, color: benchTokens.ink3, display: 'flex', alignItems: 'center', gap: 6 }}>
          <span>↓</span><span title={wire.to} style={{ flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{wire.to}</span>
          <CopyPathBtn path={wire.to} />
        </div>
      </div>
      <div style={{ background: benchTokens.panelAlt, padding: '8px 10px', borderRadius: 5, marginBottom: 12, display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontFamily: benchTokens.mono, fontSize: 11 }}>
        <span style={{ color: benchTokens.ink3 }}>{wire.bundle}</span>
        <span style={{ color: benchTokens.ink2 }}>{bTotalWidth(wire.bundle)} bits</span>
      </div>

      <div style={{ fontSize: 10.5, fontWeight: 600, color: benchTokens.ink3, letterSpacing: 0.6, textTransform: 'uppercase', marginBottom: 6 }}>Fields</div>
      {tree.children.map((child) => (
        <InspectorTreeNode key={child.path} node={child} depth={0} sig={sig} setSelectedSig={setSelectedSig} expandedBundles={expandedBundles} toggleBundle={toggleBundle} />
      ))}

      <div style={{ marginTop: 14, fontSize: 10.5, fontWeight: 600, color: benchTokens.ink3, letterSpacing: 0.6, textTransform: 'uppercase', marginBottom: 6 }}>Source</div>
      <div style={{ background: benchTokens.panelAlt, padding: '6px 10px', borderRadius: 5, fontFamily: benchTokens.mono, fontSize: 11, color: benchTokens.ink2 }}>
        {wire.label || wire.bundle}
        {/* Real source locator from WireDef.source; it used to show a
            hardcoded 'L24' on every wire (issue #97). */}
        {wire.source && wire.source.file ? (
          <span title={wire.source.file} style={{ color: benchTokens.ink4 }}>
            {' · '}{wire.source.file.split('/').pop()}:{wire.source.line}
          </span>
        ) : null}
      </div>
    </div>
  );
}

// Recursive tree node for the inspector. Expandable nodes show a chevron and
// can be toggled open/closed. Leaf nodes show name/dir/width and a copy-path button.
function InspectorTreeNode({ node, depth, sig, setSelectedSig, expandedBundles, toggleBundle }) {
  const key = node.path;
  const isOpen = expandedBundles.has(key);
  const isSel = sig === node.path;
  const indent = depth * 14;
  const color = B_CHAN[node.name] || null;

  if (node.isExpandable) {
    // Aggregate node (bundle, decoupled, vec) - shows a collapsible section.
    return (
      <div style={{ marginBottom: 3, border: `1px solid ${benchTokens.borderSoft}`, borderRadius: 5, overflow: 'hidden' }}>
        <div
          onClick={() => toggleBundle(key)}
          data-inspector-toggle={key}
          style={{
            display: 'flex', alignItems: 'center', gap: 8,
            padding: `4px 8px 4px ${8 + indent}px`,
            background: benchTokens.panelAlt, cursor: 'pointer',
            fontFamily: benchTokens.mono, fontSize: 11,
          }}
        >
          {color && <span style={{ width: 7, height: 7, borderRadius: 4, background: color, flexShrink: 0 }} />}
          <span style={{ fontWeight: 600, color: isSel ? benchTokens.accent : benchTokens.ink2 }}>{node.name}</span>
          <span style={{ color: benchTokens.ink4, fontSize: 9.5 }}>{node.bundleKey}</span>
          {node.dir && (
            <span style={{ color: benchTokens.ink4, fontSize: 9 }}>{node.dir === 'out' ? '→' : '←'}</span>
          )}
          <span style={{ marginLeft: 'auto', color: benchTokens.ink4, fontSize: 10 }}>
            {node.children.length} fields
          </span>
          <span style={{ color: benchTokens.ink4, fontSize: 9, transform: isOpen ? 'rotate(90deg)' : 'none', transition: 'transform .12s', display: 'inline-block' }}>▶</span>
        </div>
        {isOpen && (
          <div>
            {node.children.map((child) => (
              <InspectorTreeNode key={child.path} node={child} depth={depth + 1} sig={sig} setSelectedSig={setSelectedSig} expandedBundles={expandedBundles} toggleBundle={toggleBundle} />
            ))}
          </div>
        )}
      </div>
    );
  }

  // Leaf node - ground type signal.
  return (
    <div
      onClick={() => setSelectedSig(node.path)}
      style={{
        display: 'flex', alignItems: 'center', gap: 8,
        padding: `3px 8px 3px ${8 + 14 + indent}px`,
        fontFamily: benchTokens.mono, fontSize: 10.5,
        cursor: 'pointer', position: 'relative',
        background: isSel ? benchTokens.accentBg : 'transparent',
        color: isSel ? benchTokens.accent : benchTokens.ink2,
      }}
      onMouseEnter={(e) => {
        if (!isSel) e.currentTarget.style.background = benchTokens.panelAlt;
        const btn = e.currentTarget.querySelector('.copy-btn');
        if (btn) btn.style.opacity = '1';
      }}
      onMouseLeave={(e) => {
        if (!isSel) e.currentTarget.style.background = 'transparent';
        const btn = e.currentTarget.querySelector('.copy-btn');
        if (btn) btn.style.opacity = '0';
      }}
    >
      <span style={{ width: 12, color: benchTokens.ink4, fontSize: 9, flexShrink: 0 }}>
        {node.dir === 'out' ? '→' : '←'}
      </span>
      <span>{node.name}</span>
      <span style={{ marginLeft: 'auto', color: benchTokens.ink4 }}>{node.width}b</span>
      <span className="copy-btn" style={{ opacity: 0, transition: 'opacity .1s' }}>
        <CopyPathBtn path={node.path} />
      </span>
    </div>
  );
}
