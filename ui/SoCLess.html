// - Source view: code + syntax highlighting + cross-ref highlight.
// If the source code text wasn't embedded (i.e. the design was loaded from a
// real exporter that only knows file:line:col, not the full text), fall back
// to a locator-only view that points at the originating .scala file.
function SourceView({ mod, selectedSig, setSelectedSig, hoveredSig, drillInto, clickToNavigate }) {
  // Source resolution order:
  //   1. mod.source.code - explicit per-module text (bundled demo embeds these)
  //   2. window.DESIGN.SOURCES[file] - top-level map populated by the exporter
  //      when run with --source-root. This is the real-design path.
  //   3. Locator-only placeholder when neither is available.
  const file = mod.source.file;
  const fileText =
    mod.source.code ??
    (window.DESIGN.SOURCES && file ? window.DESIGN.SOURCES[file] : undefined);
  const scrollRef = React.useRef(null);
  const targetLine = mod.source.line || 0;
  // Instance names whose tokens become clickable. Drill-in is gated by
  // clickToNavigate so users can disable when it gets in the way of selection.
  // NOTE: this hook MUST run before any early return below - leaf modules with
  // no embedded source hit the `if (!fileText)` branch, and a hook after that
  // return would change the hook count between renders and crash React with
  // "Rendered fewer hooks than expected" (issue #70).
  const childInstSet = React.useMemo(
    () => new Set((mod.children || []).map((c) => c.name)),
    [mod.children],
  );

  // Auto-scroll the file to the originating line on mount / module change.
  // Place it ~1/4 from the top so the user gets some leading context.
  React.useEffect(() => {
    if (!scrollRef.current || !targetLine) return;
    const el = scrollRef.current.querySelector(`[data-line="${targetLine}"]`);
    if (!el) return;
    const parent = scrollRef.current;
    const offset = el.offsetTop - parent.clientHeight / 4;
    parent.scrollTop = Math.max(0, offset);
  }, [fileText, targetLine, file]);

  if (!fileText) {
    return (
      <div style={{ padding: '20px 22px', fontFamily: benchTokens.sans, fontSize: 12, color: benchTokens.ink2, lineHeight: 1.55, maxWidth: 520 }}>
        <div style={{ fontFamily: benchTokens.mono, fontSize: 11, color: benchTokens.ink, marginBottom: 6 }}>
          {file || '(no source recorded)'}{mod.source.line ? `:${mod.source.line}` : ''}{mod.source.col ? `:${mod.source.col}` : ''}
        </div>
        <div style={{ color: benchTokens.ink3 }}>
          Source text was not embedded in <code style={{ fontFamily: benchTokens.mono, fontSize: 11 }}>design.json</code>.
          Re-run elaboration with <code style={{ fontFamily: benchTokens.mono, fontSize: 11 }}>--source-root</code> (or use the Mill plugin) - the exporter will read the
          files relative to that root and include them. Until then, open
          <code style={{ fontFamily: benchTokens.mono, fontSize: 11 }}> {file || '(unknown)'}</code> in your editor.
        </div>
      </div>
    );
  }

  const code = fileText.split('\n');
  // Highlight lines mentioning the selected wire's instance / port - kept from
  // the demo path so signal-driven exploration still works on real designs.
  const selInst = selectedSig ? selectedSig.split('.')[0] : null;
  const selPort = selectedSig ? selectedSig.split('.').slice(0, 2).join('.') : null;
  const navToken = clickToNavigate && drillInto ? drillInto : null;

  return (
    <div ref={scrollRef} style={{ height: '100%', overflow: 'auto' }}>
      <div style={{ fontFamily: benchTokens.mono, fontSize: 11.5, lineHeight: 1.6, padding: '8px 0', display: 'grid', gridTemplateColumns: 'auto 1fr', columnGap: 12 }}>
        {code.map((line, i) => {
          const lineNo = i + 1;
          const matchInst = selInst && line.indexOf(selInst) >= 0;
          const matchPort = selPort && line.indexOf(selPort) >= 0;
          const isTarget = lineNo === targetLine;
          const isHighlight = matchInst || matchPort || isTarget;
          return (
            <React.Fragment key={i}>
              <div data-line={lineNo} style={{
                textAlign: 'right', padding: '0 4px', userSelect: 'none',
                color: isTarget ? benchTokens.accent : (isHighlight ? benchTokens.accent : benchTokens.ink4),
                background: isHighlight ? benchTokens.accentBg : 'transparent',
                fontVariantNumeric: 'tabular-nums',
                fontWeight: isTarget ? 600 : 400,
              }}>{lineNo}</div>
              <div style={{
                padding: '0 14px 0 6px',
                background: isHighlight ? benchTokens.accentBg : 'transparent',
                borderLeft: isTarget
                  ? `2px solid ${benchTokens.accent}`
                  : (isHighlight ? `2px solid ${benchTokens.accent}` : '2px solid transparent'),
                whiteSpace: 'pre',
                color: benchTokens.ink2,
              }}>{tokenizeScala(line, selInst, selPort, setSelectedSig, childInstSet, navToken)}</div>
            </React.Fragment>
          );
        })}
      </div>
    </div>
  );
}

function tokenizeScala(line, selInst, selPort, setSelectedSig, childInstSet, drillInto) {
  // Very lightweight: highlight Chisel keywords + types + instance refs +
  // make instance names clickable when drillInto is available.
  const parts = line.split(/(\s+|[(){}.,;])/);
  return parts.map((p, idx) => {
    if (!p) return null;
    if (/^\s+$/.test(p) || /^[(){}.,;]$/.test(p)) return <span key={idx}>{p}</span>;
    if (/^(class|extends|val|def|new|for|until|object|trait|case|match|if|else|when|otherwise)$/.test(p))
      return <span key={idx} style={{ color: 'oklch(0.5 0.15 290)', fontWeight: 500 }}>{p}</span>;
    if (/^(Module|IO|Bundle|Vec|Flipped|Decoupled|Queue|RRArbiter|AddrDec|RRouter|Backend|IdAllocator|AXI4|AXIMaster|AXISlave|AXISystem|AXICrossbar|TxReq|AR|R|UInt|SInt|Bool|Clock|Reset|Reg|RegInit|Mem|DontCare)$/.test(p))
      return <span key={idx} style={{ color: 'oklch(0.5 0.13 200)' }}>{p}</span>;
    if (/^(true|false)$/.test(p))
      return <span key={idx} style={{ color: 'oklch(0.55 0.15 30)' }}>{p}</span>;
    if (/^\d+$/.test(p))
      return <span key={idx} style={{ color: 'oklch(0.55 0.15 30)' }}>{p}</span>;
    // Comments
    if (/^\/\//.test(p))
      return <span key={idx} style={{ color: benchTokens.ink4, fontStyle: 'italic' }}>{p}</span>;
    // Instance names - drill-in on click when available, else select-signal.
    if (childInstSet && childInstSet.has(p)) {
      return (
        <span key={idx} onClick={() => drillInto ? drillInto(p) : setSelectedSig(p)}
          title={drillInto ? `Open ${p}` : p}
          style={{
            background: 'oklch(0.95 0.08 200)', color: 'oklch(0.4 0.15 250)',
            borderRadius: 2, padding: '0 2px', cursor: 'pointer',
            textDecoration: drillInto ? 'underline dotted' : 'none',
            textDecorationColor: 'oklch(0.55 0.15 250 / 0.45)',
            textUnderlineOffset: 2,
          }}>{p}</span>
      );
    }
    // Selected-signal highlight stays as before
    if (selInst && p === selInst)
      return <span key={idx} style={{ background: 'oklch(0.95 0.1 90)', borderRadius: 2, padding: '0 1px', cursor: 'pointer', color: benchTokens.ink }} onClick={() => setSelectedSig(p)}>{p}</span>;
    return <span key={idx}>{p}</span>;
  });
}

// - Waveform view: track names + per-cycle cells
function WaveformView({ selectedSig, setSelectedSig, setHoveredSig }) {
  const cellW = 28;
  const waves = B_WAVES && B_WAVES.length > 0 ? B_WAVES : null;
  const waveCycles = window.DESIGN.WAVE_CYCLES || B_WAVE_CYCLES || 0;
  if (!waves) {
    return (
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%', fontFamily: benchTokens.sans, fontSize: 12, color: benchTokens.ink4, padding: 24, textAlign: 'center' }}>
        No waveform data - run a simulation to populate this view.
      </div>
    );
  }
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '200px 1fr', fontFamily: benchTokens.mono, fontSize: 10.5 }}>
      <div style={{ borderRight: `1px solid ${benchTokens.borderSoft}` }}>
        <div style={{ padding: '6px 10px', height: 26, background: benchTokens.panelAlt, borderBottom: `1px solid ${benchTokens.borderSoft}`, fontSize: 10, color: benchTokens.ink3, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 0.6, display: 'flex', alignItems: 'center' }}>Signal</div>
        {waves.map((tr) => {
          const sel = selectedSig === tr.path || (selectedSig && tr.path.startsWith(selectedSig));
          return (
            <div key={tr.path}
              onClick={() => setSelectedSig(tr.path)}
              onMouseEnter={() => setHoveredSig(tr.path)}
              onMouseLeave={() => setHoveredSig(null)}
              style={{
                padding: '6px 10px', height: 26, lineHeight: '14px',
                cursor: 'pointer',
                background: sel ? benchTokens.accentBg : 'transparent',
                color: sel ? benchTokens.accent : benchTokens.ink2,
                borderBottom: `1px solid ${benchTokens.borderSoft}`,
                display: 'flex', alignItems: 'center', gap: 8,
              }}>
              <span style={{ color: benchTokens.ink4, fontSize: 9 }}>{tr.type}</span>
              <span title={tr.path} style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', flex: 1 }}>{tr.path}</span>
            </div>
          );
        })}
      </div>
      <div style={{ overflowX: 'auto' }}>
        {/* cycle ruler */}
        <div style={{ display: 'flex', height: 26, background: benchTokens.panelAlt, borderBottom: `1px solid ${benchTokens.borderSoft}`, fontSize: 9.5, color: benchTokens.ink4 }}>
          {Array.from({ length: waveCycles }, (_, i) => (
            <div key={i} style={{ width: cellW, minWidth: cellW, textAlign: 'center', borderRight: `1px solid ${benchTokens.borderSoft}`, padding: '6px 0', display: 'flex', alignItems: 'center', justifyContent: 'center', fontVariantNumeric: 'tabular-nums' }}>{i}</div>
          ))}
        </div>
        {waves.map((tr) => {
          const sel = selectedSig === tr.path;
          return (
            <div key={tr.path} style={{ display: 'flex', height: 26, borderBottom: `1px solid ${benchTokens.borderSoft}`, background: sel ? benchTokens.accentBg : 'transparent' }}>
              {tr.values.map((v, i) => {
                const isBool = tr.type === 'Bool';
                return (
                  <div key={i} style={{ width: cellW, minWidth: cellW, padding: 2, borderRight: `1px solid ${benchTokens.borderSoft}` }}>
                    {isBool ? (
                      <div style={{
                        height: '100%', background: v === '1' ? benchTokens.accent : (v === '0' ? benchTokens.panel : benchTokens.panelAlt),
                        border: v === '0' ? `1px solid ${benchTokens.borderSoft}` : 'none',

                      }} />

                      <div style={{
                        height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center',

                        background: v !== '-' ? 'oklch(0.96 0.02 250)' : 'transparent',
                        borderRadius: 1, overflow: 'hidden', whiteSpace: 'nowrap',
                      }}>{v}</div>
                    )}
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// - Ports table
function PortsView({ mod, setSelectedSig }) {
  const rows = [];
  // This module's own (boundary) ports first, then each child instance's ports.
  (mod.ports || []).forEach((p) => {
    rows.push({ inst: '(this)', type: mod.name, port: p.name, dir: p.dir, bundle: p.bundle, doc: p.doc, connected: p.connected !== false });
  });
  mod.children.forEach((c) => {
    const cm = B_MODULES[c.type];
    if (!cm) return;
    cm.ports.forEach((p) => {
      rows.push({ inst: c.name, type: c.type, port: p.name, dir: p.dir, bundle: p.bundle, doc: p.doc, connected: p.connected !== false });
    });
  });
  return (
    <table style={{ width: '100%', borderCollapse: 'collapse', fontFamily: benchTokens.mono, fontSize: 11 }}>
      <thead>
        <tr style={{ background: benchTokens.panelAlt }}>
          {['Instance', 'Type', 'Port', 'Dir', 'Bundle', 'Width', 'Notes'].map((h) => (
            <th key={h} style={{ textAlign: 'left', padding: '7px 12px', fontSize: 10, color: benchTokens.ink3, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 0.6, borderBottom: `1px solid ${benchTokens.borderSoft}` }}>{h}</th>
          ))}
        </tr>
      </thead>
      <tbody>
        {rows.map((r, i) => (
          <tr key={i}
            onClick={() => setSelectedSig(`${r.inst}.${r.port}`)}
            style={{ cursor: 'pointer', borderBottom: `1px solid ${benchTokens.borderSoft}` }}
            onMouseEnter={(e) => e.currentTarget.style.background = benchTokens.panelAlt}
            onMouseLeave={(e) => e.currentTarget.style.background = 'transparent'}
          >
            <td style={{ padding: '6px 12px', fontWeight: 600, color: benchTokens.ink }}>{r.inst}</td>
            <td style={{ padding: '6px 12px', color: benchTokens.ink3 }}>{r.type}</td>
            <td style={{ padding: '6px 12px', color: benchTokens.ink2 }}>{r.port}</td>
            <td style={{ padding: '6px 12px' }}>
              <span style={{ padding: '1px 6px', borderRadius: 2, background: r.dir === 'master' ? 'oklch(0.96 0.04 250)' : 'oklch(0.96 0.04 50)', color: r.dir === 'master' ? 'oklch(0.4 0.15 250)' : 'oklch(0.4 0.15 50)', fontSize: 10 }}>{r.dir}</span>
            </td>
            <td style={{ padding: '6px 12px', color: benchTokens.ink2 }}>{r.bundle}</td>
            <td style={{ padding: '6px 12px', color: benchTokens.ink3 }}>{bTotalWidth(r.bundle)}b</td>
            <td style={{ padding: '6px 12px', color: benchTokens.ink4, fontFamily: benchTokens.sans, fontSize: 11 }}>
              {r.connected === false && (
                <span title="This port is not referenced anywhere in the source (genuinely unconnected)."
                  style={{ padding: '1px 6px', borderRadius: 2, background: 'oklch(0.95 0.06 30)', color: 'oklch(0.45 0.16 30)', fontFamily: benchTokens.mono, fontSize: 9.5, marginRight: 6 }}>
                  unconnected
                </span>
              )}
              {r.doc}
            </td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

window.BenchApp = BenchApp;

</script>
</head>
<body>
<div id="root"><div class="socless-loading">elaborating…</div></div>

<script type="text/babel">
// Catch render errors in the app subtree so one bad component (e.g. a drill-down
// into an unusual module) shows a recoverable message instead of unmounting the
// whole page to blank (issue #70). Resetting remounts the app at the top module.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error('[socless] UI error:', error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ padding: '28px 32px', fontFamily: 'system-ui, sans-serif', color: '#333', maxWidth: 640 }}>
          <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 8 }}>Something went wrong rendering this view.</div>
          <pre style={{ fontFamily: 'ui-monospace, monospace', fontSize: 12, background: '#f5f5f5', padding: '8px 10px', borderRadius: 4, whiteSpace: 'pre-wrap' }}>
            {String(this.state.error && this.state.error.message || this.state.error)}
          </pre>
          <button onClick={() => { this.setState({ error: null }); this.props.onReset && this.props.onReset(); }}
            style={{ marginTop: 10, padding: '6px 14px', fontSize: 13, cursor: 'pointer', borderRadius: 4, border: '1px solid #ccc', background: '#fff' }}>
            Reset to top module
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

function App() {
  const [tweaks, setTweak] = useTweaks(window.__TWEAK_DEFAULTS);
  // Remount BenchApp on every design load so module-scope `const B_MODULES = ...`
  // captures pick up the fresh mutated objects + state initializers re-run with
  // the new top.
  const [version, setVersion] = React.useState(window.DESIGN.VERSION || 1);
  React.useEffect(() => {
    const onChange = () => setVersion(window.DESIGN.VERSION);
    window.addEventListener('socless:design-changed', onChange);
    return () => window.removeEventListener('socless:design-changed', onChange);
  }, []);

  return (
    <div style={{ height: '100vh', width: '100vw', overflow: 'hidden' }}>
      <ErrorBoundary key={version} onReset={() => setVersion((v) => v + 1)}>
        <BenchApp key={version} tweaks={tweaks} />
      </ErrorBoundary>
      <TweaksPanel title="Tweaks">
        <TweakSection label="Display">
          <TweakRadio label="Density" value={tweaks.density}
            onChange={(v) => setTweak('density', v)}
            options={[{ value: 'compact', label: 'Compact' }, { value: 'comfortable', label: 'Comfort' }]} />
        </TweakSection>
        <TweakSection label="Netlist">
          <TweakRadio label="Bundle display" value={tweaks.bundleMode}
            onChange={(v) => setTweak('bundleMode', v)}
            options={[
              { value: 'collapsed', label: 'Collapsed' },
              { value: 'expanded',  label: 'Expanded' },
            ]} />
          <TweakToggle label="Collapse bidirectional handshakes" value={tweaks.collapseBidir}
            onChange={(v) => setTweak('collapseBidir', v)} />
          <TweakToggle label="Click identifiers in source to navigate" value={tweaks.clickToNavigate}
            onChange={(v) => setTweak('clickToNavigate', v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

window.__DESIGN_READY.then(() => {
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});
</script>
</body>
</html>
