name: Release

# A pushed `v*` tag checks the version and the release notes, runs the test
# suites, builds the files (build-artifacts.yml) and publishes them as a GitHub
# release (see RELEASING.md); a failing suite publishes nothing. A manual
# dispatch checks, tests and builds, but does not publish: run it on a branch
# to get a change's jars, or before tagging. Pull requests and pushes to main
# do not build the files.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check version and release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      # A tag must name the version build.mill publishes; a dispatch labels
      # the files with V.publishVer as it is (usually a -SNAPSHOT).
      - name: Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          ver=$(grep -oP 'publishVer\s*=\s*"\K[^"]+' build.mill)
          if [ -z "$ver" ]; then echo "::error::V.publishVer not found in build.mill"; exit 1; fi
          if [ "$REF_TYPE" = tag ] && [ "${TAG#v}" != "$ver" ]; then
            echo "::error::tag $TAG does not match V.publishVer = $ver in build.mill: bump V.publishVer to ${TAG#v} (or tag v$ver)"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "version: $ver"

      # Releases must have notes: a tag run fails before the build without a
      # CHANGELOG.md section for its version, a dispatch only warns.
      - name: Release notes
        env:
          EVENT: ${{ github.event_name }}
          VER: ${{ steps.version.outputs.version }}
        run: |
          if tools/release/notes.sh "$VER"; then :
          elif [ "$EVENT" = push ]; then
            echo "::error::no release notes for $VER: add a '## [$VER]' section to CHANGELOG.md"
            exit 1
          else
            echo "::warning::no release notes for $VER in CHANGELOG.md (a tag run would fail)"
          fi

  # The full suites, not selective: a release is never tested against a base.
  # In parallel with `build`, so a dispatch still gets its jars when a test
  # fails. The browser smokes stay in ci.yml.
  test:
    name: Test
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # 21: the socle-probe Java agent targets Java 21 and 25.
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The UI unit tests run on Node.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Cache Mill / Coursier / Ivy caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.mill
            ~/.ivy2
          key: mill-${{ runner.os }}-release-test-${{ hashFiles('build.mill') }}
          restore-keys: |
            mill-${{ runner.os }}-release-test-
            mill-${{ runner.os }}-

      - name: Make mill wrapper executable
        run: chmod +x ./mill

      # One suite per Mill call: `./mill a.test b.test` passes b.test as a
      # selector to a.test.
      - name: Run test suite
        run: ./mill socle.test

      - name: Run probe test suite
        run: ./mill socle-probe.test

      - name: Run language server tests
        run: ./mill socle-lsp.test

      - name: Run UI unit tests
        run: ./mill socle-ui.test

      - name: Stop the Mill daemon
        if: always()
        run: ./mill shutdown || true

  build:
    name: Build
    needs: check
    uses: ./.github/workflows/build-artifacts.yml
    with:
      version: ${{ needs.check.outputs.version }}

  publish:
    name: Publish the GitHub release
    needs: [check, build, test]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download the release files
        uses: actions/download-artifact@v8
        with:
          name: socle-dist
          path: dist

      # Never overwrite a release: a re-run on an already released tag fails.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VER: ${{ needs.check.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists: not overwriting it"
            exit 1
          fi
          tools/release/notes.sh "$VER" > "$RUNNER_TEMP/notes.md"
          ls -l dist
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "Socle $VER" \
            --notes-file "$RUNNER_TEMP/notes.md"
