name: CI

on:
  push:
    branches: [main]
  pull_request:

# Rapid successive pushes should not run redundant full builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: Build, test, and elaborate examples
    runs-on: ubuntu-latest

    steps:
      # Full history: a pull request's selective run snapshots its base commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # 21: the socless-probe Java agent targets Java 21 and 25.
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Mill / Coursier / Ivy caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.mill
            ~/.ivy2
          key: mill-${{ runner.os }}-${{ hashFiles('build.mill') }}
          restore-keys: |
            mill-${{ runner.os }}-

      - name: Make mill wrapper executable
        run: chmod +x ./mill

      # Pull requests run only what their change can affect (Mill selective
      # execution): snapshot the base commit's task inputs here, then the test
      # suites below use `selective.run` and the UI smoke is skipped when none of
      # its inputs changed. Pushes to main take no snapshot and run everything.
      # See tools/ci/selective.sh.
      - name: Selective execution baseline (pull requests)
        if: github.event_name == 'pull_request'
        run: tools/ci/selective.sh prepare ${{ github.event.pull_request.base.sha }}

      - name: Compile all modules
        run: ./mill __.compile

      - name: Run test suite
        run: tools/ci/selective.sh run socless.test

      # The view-mode probe agent: forks unmodified ChiselSim tests with the
      # agent attached. View mode stops before firtool, so no Verilator needed.
      - name: Run probe test suite
        run: tools/ci/selective.sh run socless-probe.test

      # The VS Code extension's Scala.js unit tests (run on the Node set up
      # above). The vsix and the headless VS Code e2e are not run in CI.
      - name: Run VS Code extension tests
        run: tools/ci/selective.sh run socless-vscode.test

      # The language server: in-process LSP, live panel HTTP, and a stdio smoke
      # test of the assembly.
      - name: Run language server tests
        run: tools/ci/selective.sh run socless-lsp.test

      # The shipped UI (socless-ui.dist) is generated by Mill from the Scala.js
      # link + the template + vendored elkjs (epic #172 / issue #184), so there
      # is no committed artifact to drift. Build it once here so it is cached for
      # the JAR-serve checks and the UI smoke test below.
      - name: Build the UI dist
        run: ./mill socless-ui.dist

      # The committed CHIRRTL fixtures are the input to every golden test.
      # Fail if they have drifted from the current example sources / Chisel
      # (otherwise the goldens test stale input with CI green, issue #135).
      - name: CHIRRTL fixtures in sync with example sources
        run: tools/check-chirrtl-fixtures.sh

      # The committed reference design JSONs must stay loadable as the schema
      # evolves (issue #135).
      - name: Reference example JSONs are valid
        run: |
          for f in socless/test/resources/reference/*.json; do
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert isinstance(d.get('modules'),list) and d['modules'], 'no modules'; assert isinstance(d.get('top'),str) and d['top'], 'no top'" "$f" \
              || { echo "invalid reference JSON: $f"; exit 1; }
          done
          echo "reference JSONs all valid"

      # Publishing must not rot until release day: exercise the local publish
      # path for both artifacts (catches POM/metadata breakage early).
      - name: Publish artifacts locally
        run: |
          ./mill socless.publishLocal
          ./mill mill-socless.publishLocal

      # Consume the published plugin the way the README tells users to
      # (tools/consume-test): catches version drift between the two artifacts,
      # broken artifact coordinates, task wiring, and the UI server flags.
      # This is the path none of the unit tests can see (issue #103).
      - name: Plugin consumption smoke
        run: |
          ver=$(grep -oP 'publishVer\s*=\s*"\K[^"]+' build.mill)
          work=$(mktemp -d)
          cp -r tools/consume-test/. "$work/"
          cp mill "$work/mill"
          sed -i "s/SOCLESS_VERSION/$ver/" "$work/build.mill"
          (cd "$work" && ./mill demo.socless)
          json=$(find "$work/out" -name design.json | head -1)
          if [ -z "$json" ]; then echo "plugin produced no design.json"; exit 1; fi
          # Assert the emitted JSON is VALID and is the Blinky design, not just
          # that a (possibly empty/truncated) file exists (issue #134).
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['top']=='Blinky', d['top']; assert d['modules'], 'no modules'" "$json"
          # consume-test sets soclessTops=[Blinky, Counter]: assert the multi-top
          # index and the second design were emitted (issue #117).
          dz=$(find "$work/out" -name designs.json | head -1)
          if [ -z "$dz" ]; then echo "plugin produced no designs.json for the multi-top build"; exit 1; fi
          python3 -c "import json,sys; ds=json.load(open(sys.argv[1]))['designs']; ids=[d['id'] for d in ds]; assert ids==['demo.Blinky','demo.Counter'], ids" "$dz"
          counter=$(find "$work/out" -name 'design-demo_Counter.json' | head -1)
          python3 -c "import json,sys; assert json.load(open(sys.argv[1]))['top']=='Counter'" "$counter"
          (cd "$work" && timeout 120 ./mill demo.soclessServe --port 8917 >serve.log 2>&1 &)
          ok=0
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8917/SoCLess.html; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            echo "plugin UI server never served"; cat "$work/serve.log" || true; exit 1
          fi
          # The served (and JAR-embedded) UI must be the BUILT dist, not the
          # CDN-dependent dev source - the exact regression PR #113 wired the
          # build to prevent, but no gate asserted the served bytes (issue #134).
          curl -sf http://127.0.0.1:8917/SoCLess.html -o /tmp/served-ui.html
          grep -q 'GENERATED FILE' /tmp/served-ui.html || { echo "served UI is not the built dist (no GENERATED FILE banner)"; exit 1; }
          if grep -q -e 'unpkg.com' -e 'text/babel' /tmp/served-ui.html; then
            echo "served UI still references the CDN / in-browser Babel (dev source leaked into the JAR)"; exit 1
          fi
          # Exercise POST /convert (the drag-drop .fir path): the python server's
          # only dynamic endpoint, otherwise zero coverage (issue #134).
          curl -sf --data-binary @socless/test/resources/chirrtl/gcd.fir http://127.0.0.1:8917/convert \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('modules'), 'convert returned no modules'; print('convert ok: top=' + str(d.get('top')))"

      - name: Elaborate AXISystem example
        run: ./mill example.soclessRun

      - name: Elaborate GCD example
        run: ./mill example.soclessRunGcd

      - name: Elaborate RVPipeline example
        run: ./mill example.soclessRunPipeline

      - name: Elaborate DeepSoc example
        run: ./mill example.soclessRunDeepSoc

      - name: Elaborate IoBundles example
        run: ./mill example.soclessRunIoBundles

      - name: Elaborate RegHeavy example
        run: ./mill example.soclessRunRegHeavy

      - name: Elaborate Scatter example (#237 bundle direction split)
        run: ./mill example.soclessRunScatter

      - name: Convert captured DeepSoc (instance fold)
        run: ./mill example.soclessCapturedDeepSoc

      - name: Convert captured TrafficFsm (state diagram)
        run: ./mill example.soclessCapturedFsm

      # Standalone, Mill/Python-free UI server (issue #115): serve the bundled
      # dist and convert a .fir in-process. Run as a plain `java -cp` process
      # (no Mill daemon) so it can be backgrounded and killed safely.
      - name: Standalone server smoke
        run: |
          ./mill show example.runClasspath > /tmp/rc.json
          cp=$(python3 -c "import json; print(':'.join(p.split(':',3)[-1] if p.startswith('ref:') else p for p in json.load(open('/tmp/rc.json'))))")
          java -cp "$cp" socless.cli.Launcher serve --port 8923 --no-open >/tmp/serve115.log 2>&1 &
          pid=$!
          trap "kill $pid 2>/dev/null || true" EXIT
          ok=0
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8923/SoCLess.html; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then echo "standalone server never came up"; cat /tmp/serve115.log; exit 1; fi
          curl -sf http://127.0.0.1:8923/SoCLess.html | grep -q 'GENERATED FILE' || { echo "standalone server is not serving the dist"; exit 1; }
          curl -sf --data-binary @socless/test/resources/chirrtl/gcd.fir http://127.0.0.1:8923/convert \
            | python3 -c "import json,sys; assert json.load(sys.stdin)['top']=='GCD', 'convert top'; print('standalone /convert ok')"

      # ── UI interactivity smoke test ──────────────────────────────────────
      # Drives the single-file UI headlessly against every elaborated design:
      # drills into each module (incl. leaves), expands every bundle, and fails
      # on any page exception or console error. Reuses the design.json files
      # produced by the elaborate steps above. (Node + the dist sync check ran
      # right after checkout; see the top of the job.)
      #
      # On a pull request the browser smokes below (about 3 minutes with the
      # Chromium install) run only when one of their inputs changed: a Mill task
      # they drive (the UI dist, the assembly, an example design) is selected
      # against the base snapshot, or a non-Mill input changed (the smoke
      # scripts, the CHIRRTL fixtures serve-smoke uploads, CI itself).
      - name: Decide whether the UI smokes run
        id: uismoke
        run: |
          sel=$(tools/ci/selective.sh selected '{socless-ui.dist,socless.assembly,example.soclessRun,example.soclessRunPipeline,example.soclessRunGcd,example.soclessRunDeepSoc,example.soclessRunIoBundles,example.soclessRunRegHeavy,example.soclessRunFsm,example.soclessRunLayers,example.soclessRunScatter,example.soclessCapturedDeepSoc,example.soclessCapturedFsm}')
          changed=""
          if [ "${{ github.event_name }}" = pull_request ]; then
            changed=$(git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD -- tools/ui-smoke tools/ci socless/test/resources/chirrtl .github/workflows)
          fi
          printf 'selected tasks:\n%s\nchanged non-Mill inputs:\n%s\n' "$sel" "$changed"
          if [ -n "$sel$changed" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "run=false" >> "$GITHUB_OUTPUT"; echo "UI smokes skipped: none of their inputs changed"; fi

      - name: Install UI smoke deps + Chromium
        if: steps.uismoke.outputs.run == 'true'
        working-directory: tools/ui-smoke
        run: |
          npm ci
          # Keep this version identical to playwright-core in package.json:
          # a CLI/browser/runner mismatch causes "Executable doesn't exist" flakes.
          npx --yes playwright@1.60.0 install --with-deps chromium

      - name: Assemble UI serve directory
        if: steps.uismoke.outputs.run == 'true'
        run: node tools/ui-smoke/assemble.mjs site

      - name: Run UI smoke test
        if: steps.uismoke.outputs.run == 'true'
        run: |
          (cd site && python3 -m http.server 8765 >/tmp/ui-server.log 2>&1 &)
          ok=0
          for i in $(seq 1 20); do
            # The UI now lives in per-design subdirs; manifest.json is at the root.
            if curl -sf http://localhost:8765/manifest.json >/dev/null; then ok=1; break; fi
            sleep 0.5
          done
          if [ "$ok" != 1 ]; then
            echo "UI server never came up"; cat /tmp/ui-server.log; exit 1
          fi
          node tools/ui-smoke/smoke.mjs --base http://localhost:8765

      # The design-INPUT layer (#194): drag-drop a .fir (-> POST /convert), the
      # live poller (#120), the LIVE badge, and the SOURCE indicator. Drives the
      # UI in a browser against the real standalone server, which smoke.mjs (a
      # pre-baked design.json per page) structurally cannot reach.
      - name: Build the standalone assembly
        if: steps.uismoke.outputs.run == 'true'
        run: ./mill socless.assembly

      - name: Run UI server smoke (drag-drop /convert + live poller)
        if: steps.uismoke.outputs.run == 'true'
        run: |
          node tools/ui-smoke/serve-smoke.mjs \
            --jar out/socless/assembly.dest/out.jar \
            --fixtures socless/test/resources/chirrtl
