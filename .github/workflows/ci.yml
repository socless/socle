name: CI

# Pull requests only: a squash merge puts the PR's own tree on main, so a run on
# the push would repeat the PR's run. A manual run (Actions, CI, Run workflow)
# checks main, and refreshes the caches pull requests read.
on:
  pull_request:
  workflow_dispatch:

# Rapid successive pushes should not run redundant full builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Four jobs run in parallel, each compiling only what its own tasks need:
# `unit` (the socle and probe suites and the fixture checks), `lsp`
# (the language server suite), `ui` (example elaboration and the browser
# smokes) and `packaging` (publishLocal and the plugin consumption smoke). The
# distributable files are built by release.yml only (a tag, or a manual run).
#
# Pull requests run selectively (tools/ci/selective.sh), except when they
# change .github/workflows or tools/ci: then `prepare` takes no snapshot and
# every job runs everything, as on a manual run.
#
# Each Mill job caches its out/ directory, keyed on the job and on the hash of
# build.mill and of the sources it builds, so a module whose inputs did not
# change is not recompiled (Mill re-checks every input hash, so an out/ from
# another commit is safe). Pull requests read the caches saved by main (manual runs).
jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      # Full history: a pull request's selective run snapshots its base commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 21: the socle-probe Java agent targets Java 21 and 25.
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Mill / Coursier / Ivy caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.mill
            ~/.ivy2
          key: mill-${{ runner.os }}-unit-${{ hashFiles('build.mill') }}
          restore-keys: |
            mill-${{ runner.os }}-unit-
            mill-${{ runner.os }}-

      # The daemon's state and the selective snapshot are never cached.
      - name: Cache Mill out/
        uses: actions/cache@v6
        with:
          path: |
            out
            !out/mill-daemon
            !out/mill-no-daemon
            !out/mill-out-lock
            !out/mill-selective-execution.json
          key: out-unit-${{ runner.os }}-${{ hashFiles('build.mill') }}-${{ hashFiles('socle/**', 'socle-js/**', 'socle-ui/**', 'socle-probe/**', 'example/**') }}
          restore-keys: |
            out-unit-${{ runner.os }}-${{ hashFiles('build.mill') }}-
            out-unit-${{ runner.os }}-

      # A selective snapshot left in out/ would make a push run selectively:
      # only `prepare` below may create one.
      - name: Make mill wrapper executable
        run: |
          chmod +x ./mill
          rm -f out/mill-selective-execution.json

      # Pull requests run only the test suites their change can affect (Mill
      # selective execution): snapshot the base commit's task inputs here, then
      # the suites below use `selective.run`. Pushes to main take no snapshot
      # and run everything. See tools/ci/selective.sh.
      - name: Selective execution baseline (pull requests)
        if: github.event_name == 'pull_request'
        run: tools/ci/selective.sh prepare ${{ github.event.pull_request.base.sha }}

      - name: Run test suite
        run: tools/ci/selective.sh run socle.test

      # The view-mode probe agent: forks unmodified ChiselSim tests with the
      # agent attached. View mode stops before firtool, so no Verilator needed.
      - name: Run probe test suite
        run: tools/ci/selective.sh run socle-probe.test

      # The committed CHIRRTL fixtures are the input to every golden test.
      # Fail if they have drifted from the current example sources / Chisel
      # (otherwise the goldens test stale input with CI green, issue #135).
      - name: CHIRRTL fixtures in sync with example sources
        run: tools/check-chirrtl-fixtures.sh

      # The committed reference design JSONs must stay loadable as the schema
      # evolves (issue #135).
      - name: Reference example JSONs are valid
        run: |
          for f in socle/test/resources/reference/*.json; do
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert isinstance(d.get('modules'),list) and d['modules'], 'no modules'; assert isinstance(d.get('top'),str) and d['top'], 'no top'" "$f" \
              || { echo "invalid reference JSON: $f"; exit 1; }
          done
          echo "reference JSONs all valid"

      # No daemon writing into out/ while the cache step saves it.
      - name: Stop the Mill daemon
        if: always()
        run: ./mill shutdown || true

  # The language server suite on its own: MillBridgeTest drives a real Mill
  # (about 3 minutes on a 2-core runner), off the unit job's critical path.
  lsp:
    name: Language server tests
    runs-on: ubuntu-latest

    steps:
      # Full history: a pull request's selective run snapshots its base commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Mill / Coursier / Ivy caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.mill
            ~/.ivy2
          key: mill-${{ runner.os }}-lsp-${{ hashFiles('build.mill') }}
          restore-keys: |
            mill-${{ runner.os }}-lsp-
            mill-${{ runner.os }}-

      # The daemon's state and the selective snapshot are never cached.
      - name: Cache Mill out/
        uses: actions/cache@v6
        with:
          path: |
            out
            !out/mill-daemon
            !out/mill-no-daemon
            !out/mill-out-lock
            !out/mill-selective-execution.json
          key: out-lsp-${{ runner.os }}-${{ hashFiles('build.mill') }}-${{ hashFiles('socle/**', 'socle-js/**', 'socle-ui/**', 'socle-probe/**', 'socle-lsp/**', 'example/**') }}
          restore-keys: |
            out-lsp-${{ runner.os }}-${{ hashFiles('build.mill') }}-
            out-lsp-${{ runner.os }}-

      # A selective snapshot left in out/ would make a push run selectively:
      # only `prepare` below may create one.
      - name: Make mill wrapper executable
        run: |
          chmod +x ./mill
          rm -f out/mill-selective-execution.json

      # As in `unit`: pull requests run the suite only when its inputs changed.
      - name: Selective execution baseline (pull requests)
        if: github.event_name == 'pull_request'
        run: tools/ci/selective.sh prepare ${{ github.event.pull_request.base.sha }}

      # The language server: in-process LSP, live panel HTTP, and a stdio smoke
      # test of the assembly.
      - name: Run language server tests
        run: tools/ci/selective.sh run socle-lsp.test

      # No daemon writing into out/ while the cache step saves it.
      - name: Stop the Mill daemon
        if: always()
        run: ./mill shutdown || true

  ui:
    name: UI smokes and examples
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.60 has no Chromium build.
    runs-on: ubuntu-24.04

    steps:
      # Full history: the smoke gate below compares with the base commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The UI smokes run on Node.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Mill / Coursier / Ivy caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.mill
            ~/.ivy2
          key: mill-${{ runner.os }}-ui-${{ hashFiles('build.mill') }}
          restore-keys: |
            mill-${{ runner.os }}-ui-
            mill-${{ runner.os }}-

      # The captured TrafficFsm conversion runs on the language server's
      # classpath (which carries the probe jar), hence socle-lsp and
      # socle-probe in the key.
      - name: Cache Mill out/
        uses: actions/cache@v6
        with:
          path: |
            out
            !out/mill-daemon
            !out/mill-no-daemon
            !out/mill-out-lock
            !out/mill-selective-execution.json
          key: out-ui-${{ runner.os }}-${{ hashFiles('build.mill') }}-${{ hashFiles('socle/**', 'socle-js/**', 'socle-ui/**', 'socle-probe/**', 'socle-lsp/**', 'example/**') }}
          restore-keys: |
            out-ui-${{ runner.os }}-${{ hashFiles('build.mill') }}-
            out-ui-${{ runner.os }}-

      # A selective snapshot left in out/ would wrongly skip a push's smokes:
      # only `prepare` below may create one.
      - name: Make mill wrapper executable
        run: |
          chmod +x ./mill
          rm -f out/mill-selective-execution.json

      # On a pull request the browser smokes run only when one of their inputs
      # changed (the gate below asks the base snapshot taken here). Pushes to
      # main take no snapshot and run everything. See tools/ci/selective.sh.
      - name: Selective execution baseline (pull requests)
        if: github.event_name == 'pull_request'
        run: tools/ci/selective.sh prepare ${{ github.event.pull_request.base.sha }}

      # The shipped UI (socle-ui.dist) is generated by Mill from the Scala.js
      # link + the template + vendored elkjs (epic #172 / issue #184), so there
      # is no committed artifact to drift. Built here for the JAR-serve checks
      # and the UI smoke test below.
      - name: Build the UI dist
        run: ./mill socle-ui.dist

      # One Mill call, so the examples elaborate in parallel; a failure names
      # its task. AXISystem, GCD, RVPipeline, DeepSoc, IoBundles, RegHeavy,
      # TrafficFsm, LayeredCounter (verification layers), Scatter (#237 bundle
      # direction split), SpiSlave (clock domains), and the captured DeepSoc (instance fold), TrafficFsm
      # (state diagram) and GCD (internal signals, for the Waveform check)
      # conversions, and BigArray (256 boxes, the smoke's performance guard).
      - name: Elaborate the examples
        run: ./mill '{example.socleRun,example.socleRunGcd,example.socleRunPipeline,example.socleRunDeepSoc,example.socleRunIoBundles,example.socleRunRegHeavy,example.socleRunFsm,example.socleRunLayers,example.socleRunScatter,example.socleRunDomains,example.socleCapturedDeepSoc,example.socleCapturedFsm,example.socleCapturedGcd,example.socleRunBigArray}'

      # Standalone, Mill/Python-free UI server (issue #115): serve the bundled
      # dist and convert a .fir in-process. Run as a plain `java -cp` process
      # (no Mill daemon) so it can be backgrounded and killed safely.
      - name: Standalone server smoke
        run: |
          ./mill show example.runClasspath > /tmp/rc.json
          cp=$(python3 -c "import json; print(':'.join(p.split(':',3)[-1] if p.startswith('ref:') else p for p in json.load(open('/tmp/rc.json'))))")
          java -cp "$cp" socle.cli.Launcher serve --port 8923 --no-open >/tmp/serve115.log 2>&1 &
          pid=$!
          trap "kill $pid 2>/dev/null || true" EXIT
          ok=0
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8923/socle.html; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then echo "standalone server never came up"; cat /tmp/serve115.log; exit 1; fi
          curl -sf http://127.0.0.1:8923/socle.html | grep -q 'GENERATED FILE' || { echo "standalone server is not serving the dist"; exit 1; }
          curl -sf --data-binary @socle/test/resources/chirrtl/gcd.fir http://127.0.0.1:8923/convert \
            | python3 -c "import json,sys; assert json.load(sys.stdin)['top']=='GCD', 'convert top'; print('standalone /convert ok')"

      # ── UI interactivity smoke test ──────────────────────────────────────
      # Drives the single-file UI headlessly against every elaborated design:
      # drills into each module (incl. leaves), expands every bundle, and fails
      # on any page exception or console error. Reuses the design.json files
      # produced by the elaborate step above.
      #
      # On a pull request the browser smokes below run only when one of their
      # inputs changed: a Mill task they drive (the UI dist, the assembly, an
      # example design) is selected against the base snapshot, or a non-Mill
      # input changed (the smoke scripts and their fixtures, the CHIRRTL
      # fixtures serve-smoke uploads, the language server the embedded check
      # stands in for and its vendored Surfer, which that check reads from
      # disk, CI itself).
      - name: Decide whether the UI smokes run
        id: uismoke
        run: |
          sel=$(tools/ci/selective.sh selected '{socle-ui.dist,socle.assembly,example.socleRun,example.socleRunPipeline,example.socleRunGcd,example.socleRunDeepSoc,example.socleRunIoBundles,example.socleRunRegHeavy,example.socleRunFsm,example.socleRunLayers,example.socleRunScatter,example.socleRunDomains,example.socleCapturedDeepSoc,example.socleCapturedFsm,example.socleCapturedGcd,example.socleRunBigArray}')
          changed=""
          if [ "${{ github.event_name }}" = pull_request ]; then
            changed=$(git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD -- tools/ui-smoke tools/ci socle/test/resources/chirrtl socle-lsp .github/workflows)
          fi
          printf 'selected tasks:\n%s\nchanged non-Mill inputs:\n%s\n' "$sel" "$changed"
          if [ -n "$sel$changed" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "run=false" >> "$GITHUB_OUTPUT"; echo "UI smokes skipped: none of their inputs changed"; fi

      # The Playwright CLI, browser and runner must be the same version (a
      # mismatch causes "Executable doesn't exist" flakes): read it from
      # playwright-core in package.json, for the install and the cache key.
      - name: Playwright version
        id: playwright
        if: steps.uismoke.outputs.run == 'true'
        run: echo "version=$(node -p "require('./tools/ui-smoke/package.json').dependencies['playwright-core']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright's Chromium
        if: steps.uismoke.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # On a cache hit `install` skips the browser download; `--with-deps`
      # still installs the system packages Chromium needs.
      - name: Install UI smoke deps + Chromium
        if: steps.uismoke.outputs.run == 'true'
        working-directory: tools/ui-smoke
        run: |
          npm ci
          npx --yes playwright@${{ steps.playwright.outputs.version }} install --with-deps chromium

      - name: Assemble UI serve directory
        if: steps.uismoke.outputs.run == 'true'
        run: node tools/ui-smoke/assemble.mjs site

      # Four designs at once, each in its own browser context.
      - name: Run UI smoke test
        if: steps.uismoke.outputs.run == 'true'
        run: |
          (cd site && python3 -m http.server 8765 >/tmp/ui-server.log 2>&1 &)
          ok=0
          for i in $(seq 1 20); do
            # The UI now lives in per-design subdirs; manifest.json is at the root.
            if curl -sf http://localhost:8765/manifest.json >/dev/null; then ok=1; break; fi
            sleep 0.5
          done
          if [ "$ok" != 1 ]; then
            echo "UI server never came up"; cat /tmp/ui-server.log; exit 1
          fi
          node tools/ui-smoke/smoke.mjs --base http://localhost:8765 --concurrency 4

      # Embedded mode (the VS Code panel): the chrome it drops, the theme and
      # side-panel channels, and the Waveform tab, which boots the vendored
      # Surfer (socle-lsp/vendor/surfer) on a GCD trace fixture with
      # software WebGL and follows the selection. It serves the dist and the
      # designs elaborated above itself (its default paths).
      - name: Run embedded-mode smoke (VS Code panel, Waveform tab)
        if: steps.uismoke.outputs.run == 'true'
        run: node tools/ui-smoke/embedded.mjs

      # The design-INPUT layer (#194): drag-drop a .fir (-> POST /convert), the
      # live poller (#120), the LIVE badge, and the SOURCE indicator. Drives the
      # UI in a browser against the real standalone server, which smoke.mjs (a
      # pre-baked design.json per page) structurally cannot reach.
      - name: Build the standalone assembly
        if: steps.uismoke.outputs.run == 'true'
        run: ./mill socle.assembly

      - name: Run UI server smoke (drag-drop /convert + live poller)
        if: steps.uismoke.outputs.run == 'true'
        run: |
          node tools/ui-smoke/serve-smoke.mjs \
            --jar out/socle/assembly.dest/out.jar \
            --fixtures socle/test/resources/chirrtl

      # No daemon writing into out/ while the cache step saves it.
      - name: Stop the Mill daemon
        if: always()
        run: ./mill shutdown || true

  packaging:
    name: Packaging (publish + plugin consumption)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Mill / Coursier / Ivy caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.mill
            ~/.ivy2
          key: mill-${{ runner.os }}-packaging-${{ hashFiles('build.mill') }}
          restore-keys: |
            mill-${{ runner.os }}-packaging-
            mill-${{ runner.os }}-

      - name: Cache Mill out/
        uses: actions/cache@v6
        with:
          path: |
            out
            !out/mill-daemon
            !out/mill-no-daemon
            !out/mill-out-lock
            !out/mill-selective-execution.json
          key: out-packaging-${{ runner.os }}-${{ hashFiles('build.mill') }}-${{ hashFiles('socle/**', 'socle-js/**', 'socle-ui/**', 'mill-socle/**') }}
          restore-keys: |
            out-packaging-${{ runner.os }}-${{ hashFiles('build.mill') }}-
            out-packaging-${{ runner.os }}-

      - name: Make mill wrapper executable
        run: chmod +x ./mill

      # Publishing must not rot until release day: exercise the local publish
      # path for both artifacts (catches POM/metadata breakage early).
      - name: Publish artifacts locally
        run: |
          ./mill socle.publishLocal
          ./mill mill-socle.publishLocal

      # Consume the published plugin the way the README tells users to
      # (tools/consume-test): catches version drift between the two artifacts,
      # broken artifact coordinates, task wiring, and the UI server flags.
      # This is the path none of the unit tests can see (issue #103).
      - name: Plugin consumption smoke
        run: |
          ver=$(grep -oP 'publishVer\s*=\s*"\K[^"]+' build.mill)
          work=$(mktemp -d)
          cp -r tools/consume-test/. "$work/"
          cp mill "$work/mill"
          sed -i "s/SOCLE_VERSION/$ver/" "$work/build.mill"
          (cd "$work" && ./mill demo.socle)
          json=$(find "$work/out" -name design.json | head -1)
          if [ -z "$json" ]; then echo "plugin produced no design.json"; exit 1; fi
          # Assert the emitted JSON is VALID and is the Blinky design, not just
          # that a (possibly empty/truncated) file exists (issue #134).
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['top']=='Blinky', d['top']; assert d['modules'], 'no modules'" "$json"
          # consume-test sets socleTops=[Blinky, Counter]: assert the multi-top
          # index and the second design were emitted (issue #117).
          dz=$(find "$work/out" -name designs.json | head -1)
          if [ -z "$dz" ]; then echo "plugin produced no designs.json for the multi-top build"; exit 1; fi
          python3 -c "import json,sys; ds=json.load(open(sys.argv[1]))['designs']; ids=[d['id'] for d in ds]; assert ids==['demo.Blinky','demo.Counter'], ids" "$dz"
          counter=$(find "$work/out" -name 'design-demo_Counter.json' | head -1)
          python3 -c "import json,sys; assert json.load(open(sys.argv[1]))['top']=='Counter'" "$counter"
          (cd "$work" && timeout 120 ./mill demo.socleServe --port 8917 >serve.log 2>&1 &)
          ok=0
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8917/socle.html; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            echo "plugin UI server never served"; cat "$work/serve.log" || true; exit 1
          fi
          # The served (and JAR-embedded) UI must be the BUILT dist, not the
          # CDN-dependent dev source - the exact regression PR #113 wired the
          # build to prevent, but no gate asserted the served bytes (issue #134).
          curl -sf http://127.0.0.1:8917/socle.html -o /tmp/served-ui.html
          grep -q 'GENERATED FILE' /tmp/served-ui.html || { echo "served UI is not the built dist (no GENERATED FILE banner)"; exit 1; }
          if grep -q -e 'unpkg.com' -e 'text/babel' /tmp/served-ui.html; then
            echo "served UI still references the CDN / in-browser Babel (dev source leaked into the JAR)"; exit 1
          fi
          # Exercise POST /convert (the drag-drop .fir path): the python server's
          # only dynamic endpoint, otherwise zero coverage (issue #134).
          curl -sf --data-binary @socle/test/resources/chirrtl/gcd.fir http://127.0.0.1:8917/convert \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('modules'), 'convert returned no modules'; print('convert ok: top=' + str(d.get('top')))"

      # No daemon writing into out/ while the cache step saves it.
      - name: Stop the Mill daemon
        if: always()
        run: ./mill shutdown || true
