<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoCLess</title>
<style>
  /* Theme tokens (issue #2). Every color resolves to one of these CSS variables
     (see Tokens.scala), so flipping data-theme on <html> re-themes the whole app
     at paint time. Light is the default; dark overrides below. The set-before-
     paint script and the topbar toggle (App.scala) drive data-theme. */
  :root {
    --bg: #fbfbfa; --panel: #ffffff; --panelAlt: #f5f5f4;
    --border: #e5e5e3; --borderSoft: #ececea;
    --ink: #1a1a18; --ink2: #525250; --ink3: #70706e; --ink4: #767674;
    --accent: oklch(0.55 0.16 250); --accentBg: oklch(0.96 0.02 250);
    --accentLine: oklch(0.55 0.16 250 / 0.18);
    --hi: oklch(0.95 0.05 90); --ok: oklch(0.60 0.13 150); --warn: oklch(0.65 0.16 50);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    /* Accent palette (#220): panel-pane colors that used to be inline OKLCH
       literals in Inspector / BottomPanel / Chrome. Kept here so they recolor
       under dark theme like every other token. */
    --chan-ar: oklch(0.60 0.16 250); --chan-aw: oklch(0.55 0.17 290);
    --chan-w: oklch(0.62 0.17 170); --chan-r: oklch(0.65 0.16 50);
    --chan-b: oklch(0.58 0.18 25);
    --kind-instance: oklch(0.55 0.16 290); --kind-port: oklch(0.55 0.16 50);
    /* Schematic component-coloring fills (#266), pale tints keyed by node kind,
       hues matching the debug-layout palette. --wire-l/--wire-c drive the hashed
       wire-stroke colors so they read on this (light) surface. */
    --node-inst: oklch(0.93 0.04 250); --node-boundary: oklch(0.94 0.06 90);
    --node-reg: oklch(0.93 0.06 150); --node-const: oklch(0.93 0.05 305);
    --node-op: oklch(0.92 0.06 25); --node-fsm: oklch(0.93 0.05 215);
    --wire-l: 0.58; --wire-c: 0.16;
    --syntax-kw: oklch(0.5 0.15 290); --syntax-ty: oklch(0.5 0.13 200);
    --syntax-lit: oklch(0.55 0.15 30);
    --link-child-bg: oklch(0.95 0.08 200); --link-child-fg: oklch(0.4 0.15 250);
    --link-sel-bg: oklch(0.95 0.1 90);
    --dir-master-bg: oklch(0.96 0.04 250); --dir-master-fg: oklch(0.4 0.15 250);
    --dir-slave-bg: oklch(0.96 0.04 50); --dir-slave-fg: oklch(0.4 0.15 50);
    --badge-unconn-bg: oklch(0.95 0.06 30); --badge-unconn-fg: oklch(0.45 0.16 30);
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --panel: #161b22; --panelAlt: #21262d;
    --border: #30363d; --borderSoft: #21262d;
    --ink: #e6edf3; --ink2: #c9d1d9; --ink3: #8b949e; --ink4: #6e7681;
    --accent: #1f6feb; --accentBg: #11213a; --accentLine: rgba(56,139,253,0.4);
    --hi: rgba(56,139,253,0.15); --ok: #3fb950; --warn: #d29922;
    /* Dark variants of the #220 accent palette: accents lifted in lightness to
       read on the dark surfaces, badge backgrounds darkened with light text. */
    --chan-ar: oklch(0.70 0.15 250); --chan-aw: oklch(0.68 0.16 290);
    --chan-w: oklch(0.72 0.15 170); --chan-r: oklch(0.75 0.15 50);
    --chan-b: oklch(0.68 0.17 25);
    --kind-instance: oklch(0.70 0.15 290); --kind-port: oklch(0.72 0.15 50);
    /* Dark variants of the #266 schematic colors: dark-tinted node fills so the
       box reads as colored while light ink stays legible, wire hue lifted in
       lightness to read on the dark canvas. */
    --node-inst: oklch(0.32 0.04 250); --node-boundary: oklch(0.34 0.05 90);
    --node-reg: oklch(0.34 0.05 150); --node-const: oklch(0.33 0.05 305);
    --node-op: oklch(0.33 0.06 25); --node-fsm: oklch(0.33 0.05 215);
    --wire-l: 0.72; --wire-c: 0.15;
    --syntax-kw: oklch(0.72 0.14 290); --syntax-ty: oklch(0.72 0.12 200);
    --syntax-lit: oklch(0.75 0.14 40);
    --link-child-bg: oklch(0.30 0.06 200); --link-child-fg: oklch(0.80 0.12 250);
    --link-sel-bg: oklch(0.32 0.08 90);
    --dir-master-bg: oklch(0.30 0.05 250); --dir-master-fg: oklch(0.80 0.12 250);
    --dir-slave-bg: oklch(0.30 0.05 50); --dir-slave-fg: oklch(0.82 0.12 50);
    --badge-unconn-bg: oklch(0.32 0.07 30); --badge-unconn-fg: oklch(0.80 0.13 30);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: 13px; }
  .scl-shell { display: flex; flex-direction: column; height: 100vh; }
  .scl-topbar { display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    border-bottom: 1px solid var(--border); background: var(--panel); }
  .scl-logo { font-weight: 700; flex-shrink: 0; }
  .scl-sub { color: var(--ink3); }
  .scl-engine { color: var(--accent); flex-shrink: 0; }
  /* SOURCE indicator + LIVE badge (#194 / #120). */
  .scl-live { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
    color: var(--ok); font-size: 11px; }
  .scl-live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
    animation: scl-pulse 1.8s ease-in-out infinite; }
  .scl-live-ago { color: var(--ink4); }
  @keyframes scl-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(63,185,80,0.5); }
    70%  { box-shadow: 0 0 0 5px rgba(63,185,80,0); }
    100% { box-shadow: 0 0 0 0 rgba(63,185,80,0); }
  }
  /* Drag-drop overlay (#194): full-window, click-through (drop is on window). */
  .scl-dropzone { position: fixed; inset: 0; z-index: 9000; display: none;
    align-items: center; justify-content: center; pointer-events: none;
    background: rgba(13,17,23,0.72); backdrop-filter: blur(2px); }
  .scl-dropzone.on { display: flex; }
  .scl-dropzone-card { border: 2px dashed var(--accent); border-radius: 10px;
    padding: 28px 40px; background: var(--panel); color: var(--ink); text-align: center; font-size: 14px; }
  .scl-dropzone-card strong { display: block; margin-bottom: 6px; font-weight: 600; }
  .scl-dropzone-sub { color: var(--ink3); font-size: 12px; }
  /* Toasts (#194): transient drag-drop / conversion feedback. */
  .scl-toasts { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    z-index: 9100; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  .scl-toast { padding: 8px 14px; border-radius: 6px; font-size: 12px; color: var(--ink);
    background: var(--panelAlt); border: 1px solid var(--border); box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
  .scl-toast-err  { border-color: #f85149; color: #ffb4ab; }
  .scl-toast-ok   { border-color: var(--ok); }
  .scl-toast-info { border-color: var(--accent); }
  /* Topbar chrome (#172 Phase 4). */
  .scl-crumbs { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0;
    overflow: hidden; color: var(--ink2); margin-left: 4px; }
  .scl-crumb { border: none; background: transparent; cursor: pointer; color: var(--ink2);
    font-family: var(--mono); font-size: 11px; padding: 3px 6px; border-radius: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
  .scl-crumb:hover { background: var(--panelAlt); }
  .scl-crumb.active { color: var(--ink); font-weight: 600; }
  .scl-crumb-sep { color: var(--ink4); flex-shrink: 0; }
  .scl-search { display: flex; align-items: center; gap: 6px; background: var(--panelAlt);
    padding: 5px 10px; border-radius: 5px; color: var(--ink3); width: 220px; border: none;
    cursor: pointer; text-align: left; flex-shrink: 0; font-size: 11.5px; }
  .scl-search:hover { background: var(--border); }
  .scl-kbd { margin-left: auto; font-family: var(--mono); font-size: 10px; padding: 1px 4px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 3px; }
  .scl-help-btn { border: 1px solid var(--border); background: transparent; cursor: pointer;
    color: var(--ink3); border-radius: 50%; width: 20px; height: 20px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
  .scl-help-btn:hover { background: var(--panelAlt); color: var(--ink); }
  /* Theme toggle (issue #2): same chrome as the help button, sun/moon glyph. */
  .scl-theme-btn { border: 1px solid var(--border); background: transparent; cursor: pointer;
    color: var(--ink3); border-radius: 50%; width: 22px; height: 22px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 12px; line-height: 1; }
  .scl-theme-btn:hover { background: var(--panelAlt); color: var(--ink); }
  .scl-panes { display: flex; flex: 1; min-height: 0; }
  .scl-pane { display: flex; flex-direction: column; border-right: 1px solid var(--border); overflow: auto; }
  .scl-pane-hierarchy { width: 240px; }
  .scl-pane-schematic { flex: 1;
    background: radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0) 0 0/20px 20px, var(--bg); }
  .scl-pane-inspector { width: 300px; border-right: none; }
  .scl-pane-title { padding: 8px 12px; color: var(--ink3); font-size: 11px;
    letter-spacing: .04em; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; }
  .scl-pane-body { padding: 12px; color: var(--ink3); }
  .scl-count { color: var(--ink3); }
  .scl-hier { padding: 4px 2px; }
  .scl-hier-row { display: flex; align-items: center; gap: 4px; height: 24px;
    padding: 0 4px; cursor: pointer; font-size: 12px; color: var(--ink);
    border-left: 2px solid transparent; white-space: nowrap; overflow: hidden; }
  .scl-hier-row:hover { background: var(--bg); }
  .scl-hier-row.active { background: rgba(31,111,235,0.15);
    border-left-color: var(--accent); color: var(--accent); font-weight: 600; }
  .scl-hier-toggle { width: 12px; display: inline-flex; justify-content: center;
    color: var(--ink3); font-size: 10px; }
  .scl-hier-glyph { width: 12px; text-align: center; color: var(--ink3); font-size: 10px; }
  .scl-hier-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scl-hier-type { margin-left: auto; color: var(--ink3); font-size: 10.5px;
    max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Center column = schematic + bottom panel (#172 Phase 3). */
  .scl-center { flex: 1; display: flex; flex-direction: column; min-width: 0;
    border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  .scl-bottom { height: 240px; flex-shrink: 0; border-top: 1px solid var(--border);
    background: var(--panel); display: flex; flex-direction: column; overflow: hidden; }
  /* Drag handle on the top edge of the bottom panel (#206). */
  .scl-bottom-resize { height: 6px; flex-shrink: 0; cursor: ns-resize; background: transparent; }
  .scl-bottom-resize:hover { background: var(--accent); opacity: 0.45; }
  /* Panel-toggle buttons dim when their pane is hidden (#206). */
  .scl-panel-btn.off { opacity: 0.4; }
  .scl-bottom-tabs { display: flex; height: 30px; align-items: stretch;
    border-bottom: 1px solid var(--borderSoft); }
  .scl-bottom-body { flex: 1; overflow: auto; position: relative; }
  .scl-ports-row:hover { background: var(--panelAlt); }
  /* Inspector pane (#172 Phase 3). */
  .scl-pane-inspector { width: 304px; flex-shrink: 0; }
  .scl-insp-clear { border: none; background: transparent; color: var(--ink3);
    font-size: 11px; cursor: pointer; text-transform: none; letter-spacing: 0; }
  .scl-insp-leaf:hover { background: var(--panelAlt); }
  .scl-insp-leaf .copy-btn { opacity: 0; transition: opacity .1s; }
  .scl-insp-leaf:hover .copy-btn { opacity: 1; }
</style>
<script>
  // Set the theme before first paint so there is no light/dark flash (issue #2).
  // Order: saved choice in localStorage, else the OS prefers-color-scheme.
  (function () {
    try {
      var saved = localStorage.getItem('socless-theme');
      var dark = saved ? saved === 'dark'
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) { /* private mode / no storage - default light */ }
  })();
</script>
</head>
<body>
<div id="root"></div>
<!-- elkjs: the layout engine. CDN tag for the dev loop; the `socless-ui.dist`
     Mill task swaps it for the vendored bundle inlined offline (epic #172). -->
<script src="https://unpkg.com/elkjs@0.9.1/lib/elk.bundled.js"></script>
<!-- socless-ui: the Scala.js + Laminar frontend. The `socless-ui.dist` task
     inlines the fullLinkJS output here in place of this tag (no committed
     artifact). For a manual dev loop, drop the linked main.js next to this
     file as socless-ui.js and serve over HTTP. -->
<script src="socless-ui.js"></script>
<script>
  window.SoclessUI = (typeof SoclessUI !== 'undefined') ? SoclessUI : window.SoclessUI;
  if (window.SoclessUI) window.SoclessUI.main('root');
</script>
</body>
</html>
