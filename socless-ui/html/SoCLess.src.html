<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoCLess</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --ink: #e6edf3; --ink3: #8b949e;
    --border: #30363d; --accent: #1f6feb;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    /* Schematic theme tokens (mirror the JS UI's dark theme benchTokens). */
    --panelAlt: #21262d; --borderSoft: #21262d;
    --ink2: #c9d1d9; --ink4: #6e7681;
    --accentBg: #11213a; --accentLine: rgba(56,139,253,0.4);
    --hi: rgba(56,139,253,0.15); --ok: #3fb950; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: 13px; }
  .scl-shell { display: flex; flex-direction: column; height: 100vh; }
  .scl-topbar { display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    border-bottom: 1px solid var(--border); background: var(--panel); }
  .scl-logo { font-weight: 700; flex-shrink: 0; }
  .scl-sub { color: var(--ink3); }
  .scl-engine { color: var(--accent); flex-shrink: 0; }
  /* Topbar chrome (#172 Phase 4). */
  .scl-crumbs { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0;
    overflow: hidden; color: var(--ink2); margin-left: 4px; }
  .scl-crumb { border: none; background: transparent; cursor: pointer; color: var(--ink2);
    font-family: var(--mono); font-size: 11px; padding: 3px 6px; border-radius: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
  .scl-crumb:hover { background: var(--panelAlt); }
  .scl-crumb.active { color: var(--ink); font-weight: 600; }
  .scl-crumb-sep { color: var(--ink4); flex-shrink: 0; }
  .scl-search { display: flex; align-items: center; gap: 6px; background: var(--panelAlt);
    padding: 5px 10px; border-radius: 5px; color: var(--ink3); width: 220px; border: none;
    cursor: pointer; text-align: left; flex-shrink: 0; font-size: 11.5px; }
  .scl-search:hover { background: var(--border); }
  .scl-kbd { margin-left: auto; font-family: var(--mono); font-size: 10px; padding: 1px 4px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 3px; }
  .scl-help-btn { border: 1px solid var(--border); background: transparent; cursor: pointer;
    color: var(--ink3); border-radius: 50%; width: 20px; height: 20px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
  .scl-help-btn:hover { background: var(--panelAlt); color: var(--ink); }
  .scl-panes { display: flex; flex: 1; min-height: 0; }
  .scl-pane { display: flex; flex-direction: column; border-right: 1px solid var(--border); overflow: auto; }
  .scl-pane-hierarchy { width: 240px; }
  .scl-pane-schematic { flex: 1;
    background: radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0) 0 0/20px 20px, var(--bg); }
  .scl-pane-inspector { width: 300px; border-right: none; }
  .scl-pane-title { padding: 8px 12px; color: var(--ink3); font-size: 11px;
    letter-spacing: .04em; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; }
  .scl-pane-body { padding: 12px; color: var(--ink3); }
  .scl-count { color: var(--ink3); }
  .scl-hier { padding: 4px 2px; }
  .scl-hier-row { display: flex; align-items: center; gap: 4px; height: 24px;
    padding: 0 4px; cursor: pointer; font-size: 12px; color: var(--ink);
    border-left: 2px solid transparent; white-space: nowrap; overflow: hidden; }
  .scl-hier-row:hover { background: var(--bg); }
  .scl-hier-row.active { background: rgba(31,111,235,0.15);
    border-left-color: var(--accent); color: var(--accent); font-weight: 600; }
  .scl-hier-toggle { width: 12px; display: inline-flex; justify-content: center;
    color: var(--ink3); font-size: 10px; }
  .scl-hier-glyph { width: 12px; text-align: center; color: var(--ink3); font-size: 10px; }
  .scl-hier-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scl-hier-type { margin-left: auto; color: var(--ink3); font-size: 10.5px;
    max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Center column = schematic + bottom panel (#172 Phase 3). */
  .scl-center { flex: 1; display: flex; flex-direction: column; min-width: 0;
    border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  .scl-bottom { height: 240px; flex-shrink: 0; border-top: 1px solid var(--border);
    background: var(--panel); display: flex; flex-direction: column; overflow: hidden; }
  .scl-bottom-tabs { display: flex; height: 30px; align-items: stretch;
    border-bottom: 1px solid var(--borderSoft); }
  .scl-bottom-body { flex: 1; overflow: auto; position: relative; }
  .scl-ports-row:hover { background: var(--panelAlt); }
  /* Inspector pane (#172 Phase 3). */
  .scl-pane-inspector { width: 304px; flex-shrink: 0; }
  .scl-insp-clear { border: none; background: transparent; color: var(--ink3);
    font-size: 11px; cursor: pointer; text-transform: none; letter-spacing: 0; }
  .scl-insp-leaf:hover { background: var(--panelAlt); }
  .scl-insp-leaf .copy-btn { opacity: 0; transition: opacity .1s; }
  .scl-insp-leaf:hover .copy-btn { opacity: 1; }
</style>
</head>
<body>
<div id="root"></div>
<!-- elkjs: the layout engine. CDN tag for the dev loop; the `socless-ui.dist`
     Mill task swaps it for the vendored bundle inlined offline (epic #172). -->
<script src="https://unpkg.com/elkjs@0.9.1/lib/elk.bundled.js"></script>
<!-- socless-ui: the Scala.js + Laminar frontend. The `socless-ui.dist` task
     inlines the fullLinkJS output here in place of this tag (no committed
     artifact). For a manual dev loop, drop the linked main.js next to this
     file as socless-ui.js and serve over HTTP. -->
<script src="socless-ui.js"></script>
<script>
  window.SoclessUI = (typeof SoclessUI !== 'undefined') ? SoclessUI : window.SoclessUI;
  if (window.SoclessUI) window.SoclessUI.main('root');
</script>
</body>
</html>
